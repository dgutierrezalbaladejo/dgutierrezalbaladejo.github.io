<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi entreno</title>
<meta name="description" content="Tu plan diario de entreno en casa: fuerza, caminar, báscula y racha.">
<meta name="theme-color" content="#F3F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#08090B" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi entreno">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
html{-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
button,input,textarea,label{-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:none}
/* Layout: app de una columna. Arriba barra con logo y racha; abajo tres pestañas.
   Hoy = saludo + semana + anillos + accesos rápidos + "Hoy toca". Progreso = racha, semana, objetivo, báscula, récords. Historial = por semanas. */
/* Paleta: neutros fríos casi negros (oscuro) o gris claro (claro). Tres colores de anillo muy vivos
   (pasos rosa-coral, ejercicio lima, plan cian), naranja para la racha, lima como botón de acción. */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --surface2:#ECEEF2; --ink:#0E1116; --muted:#5D6573; --line:#E1E4EA;
  --accent:#2F7D00; --cta:#A4EE36; --cta-ink:#0B0D10; --soft:#EAF7D9;
  --ok:#3A8F0B; --ok-soft:#E5F5D3; --on-ok:#FFFFFF; --part:#C27C00; --part-soft:#FFF1D2;
  --r1:#F2245A; --r2:#5CB800; --r3:#00A3BF; --flame:#FF7A00; --flame2:#FFB000;
  --c-fuerza:#FF5A36; --c-caminar:#3FA300; --c-libre:#0094C6;
  --logo-a:#FF3B6B; --logo-b:#FF8A2B; --scrim:rgba(8,10,14,.5); --shadow:0 1px 2px rgba(14,17,22,.06),0 6px 20px rgba(14,17,22,.05);
  --display:"Nunito","Nunito Sans",system-ui,sans-serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08090B; --surface:#141619; --surface2:#1E2126; --ink:#F4F6F8; --muted:#8E96A3; --line:#262A31;
  --accent:#B6F24A; --cta:#B6F24A; --cta-ink:#0B0D10; --soft:rgba(182,242,74,.12);
  --ok:#B6F24A; --ok-soft:rgba(182,242,74,.13); --on-ok:#0B0D10; --part:#FFC23D; --part-soft:rgba(255,194,61,.14);
  --r1:#FF3B6B; --r2:#B6F24A; --r3:#2EDCF2; --flame:#FF8A1F; --flame2:#FFC23D;
  --c-fuerza:#FF6A45; --c-caminar:#B6F24A; --c-libre:#2EDCF2;
  --scrim:rgba(0,0,0,.65); --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08090B; --surface:#141619; --surface2:#1E2126; --ink:#F4F6F8; --muted:#8E96A3; --line:#262A31;
  --accent:#B6F24A; --cta:#B6F24A; --cta-ink:#0B0D10; --soft:rgba(182,242,74,.12);
  --ok:#B6F24A; --ok-soft:rgba(182,242,74,.13); --on-ok:#0B0D10; --part:#FFC23D; --part-soft:rgba(255,194,61,.14);
  --r1:#FF3B6B; --r2:#B6F24A; --r3:#2EDCF2; --flame:#FF8A1F; --flame2:#FFC23D;
  --c-fuerza:#FF6A45; --c-caminar:#B6F24A; --c-libre:#2EDCF2;
  --scrim:rgba(0,0,0,.65); --shadow:none; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(88px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column}
h1,h2,.num{font-family:var(--display);font-weight:900;letter-spacing:-.01em}
h2{font-family:var(--body);font-size:.8rem;margin:0;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:800}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tab{font-variant-numeric:tabular-nums}
svg{display:block}
.rel{color:var(--muted);font-size:.9rem}
.card{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{display:flex;flex-direction:column;gap:14px}
.panel[hidden]{display:none}
.ptitle{font-family:var(--display);font-weight:900;font-size:2.2rem;margin:2px 0 0;line-height:1.05}

/* barra superior */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:flex;align-items:center;gap:10px;padding-block:14px 10px;margin-bottom:4px;border-bottom:1px solid transparent}
.appbar.scrolled{border-bottom-color:var(--line)}
.logo{width:34px;height:34px;flex:none}
.brand{font-family:var(--display);font-size:1.45rem;font-weight:900;letter-spacing:-.02em;line-height:1;flex:1;min-width:0}
.racha{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 9px;font-size:.88rem;font-weight:700;flex:none}
.racha svg{width:17px;height:17px;color:var(--flame)}
.racha.zero svg{color:var(--muted)}

/* Hoy: saludo y semana */
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.hi{color:var(--muted);font-weight:600;font-size:.95rem}
.hello h1{margin:0;font-size:1.9rem;letter-spacing:-.02em;line-height:1.05;text-wrap:balance}
.chip-btn{border:1px solid var(--accent);background:var(--soft);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:.85rem;font-weight:600;flex:none}
.weekbar{display:flex;align-items:center;gap:4px}
.nav{width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:var(--muted);font-size:1.3rem;display:grid;place-items:center;flex:none}
.week{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:2px;min-width:0}
.wd{border:0;background:transparent;border-radius:14px;padding:6px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px}
.wd .l{font-size:.72rem;color:var(--muted);font-weight:700}
.wd .d{font-family:var(--display);font-size:1.15rem;font-weight:800;line-height:1}
.wd.today .d{color:var(--accent)}
.wd.sel{background:var(--surface2)}
.wd.sel .d{color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line)}
.dot.done{background:var(--ok);border-color:var(--ok)}
.dot.part{background:var(--part);border-color:var(--part)}
.dot.rest{border-style:dashed;border-color:var(--muted)}
.dot.fut{opacity:.5}
.note{font-size:.9rem;background:var(--part-soft);color:var(--ink);border-radius:12px;padding:10px 12px}

/* anillos */
.rings-card{flex-direction:row;align-items:center;gap:16px}
.rings{width:128px;height:128px;flex:none}
.rt{fill:none;stroke-width:11;opacity:.2}
.rp{fill:none;stroke-width:11;stroke-linecap:round;transition:stroke-dasharray .6s ease}
.rleg{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.ri{display:flex;align-items:flex-start;gap:9px;border:0;background:transparent;padding:0;text-align:left;min-width:0}
.rdot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:5px}
.rl{font-size:.72rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.rv{font-family:var(--display);font-size:1.35rem;font-weight:900;line-height:1.1}
.rv small{font-family:var(--body);font-size:.8rem;font-weight:500;color:var(--muted)}

/* accesos rápidos */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qt{border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);border-radius:18px;padding:11px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.qt svg{width:38px;height:38px;padding:8px;border-radius:13px;background:color-mix(in srgb,currentColor 15%,transparent)}
.qt .t{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.qt .v{font-size:.92rem;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.q-pasos svg{color:var(--r1)}.q-bascula svg{color:var(--flame)}.q-reloj svg{color:var(--r2)}.q-notas svg{color:var(--r3)}
.qt.hot{border-color:var(--flame);background:color-mix(in srgb,var(--flame) 10%,var(--surface))}

/* tarjeta Hoy toca */
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.link{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:.92rem;padding:4px 0}
.link.center{align-self:center}
.dt{font-family:var(--display);font-size:2.2rem;line-height:1;margin:0;text-transform:none;letter-spacing:-.02em;color:var(--ink);font-weight:900}
.dt span{color:var(--muted);font-weight:600;font-size:1.4rem}
.meta{color:var(--muted);font-size:.95rem;margin-top:-8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:600;font-size:.88rem;color:var(--muted)}
.seg.seg3{grid-template-columns:repeat(3,1fr)}
.seg.seg3 button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 4px;line-height:1.15}
.seg.seg3 b{font-weight:800;font-size:.9rem}
.seg.seg3 small{font-size:.76rem;font-weight:600;opacity:.85}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}
.prog{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.prog .tab{font-weight:700;font-size:.95rem}
.cta{border:0;background:var(--cta);color:var(--cta-ink);border-radius:999px;padding:16px 18px;font-weight:800;font-size:1.08rem;display:flex;align-items:center;justify-content:center;gap:10px}
.cta svg{width:20px;height:20px}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:600}
.ghost.sm{padding:7px 14px;font-size:.92rem}
.done-banner{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--ok-soft);color:var(--ok);border-radius:14px;padding:14px;font-weight:700}
.done-banner svg{width:20px;height:20px}
.exlist{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px;padding-top:12px;border-top:1px solid var(--line)}
.ex-info{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:0}
.ex-n{font-weight:600;display:block}
.ex-t{color:var(--muted);font-size:.86rem;display:block}
.ex-ver{display:block;font-size:.8rem;font-weight:600;color:var(--accent);margin-top:2px}
.sets{display:flex;gap:6px;flex:none}
.sets button{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:transparent;font-family:var(--display);font-size:1.1rem;font-weight:700;color:var(--muted)}
.sets button[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.reps{width:54px;flex:none}
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;box-sizing:border-box}
.reps input{text-align:center;padding:8px 4px}
label.lab{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.92rem}
.check{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:transparent;text-align:left;font-weight:600}
.check .box{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--muted);display:grid;place-items:center;flex:none;font-size:.85rem}
.check[aria-pressed="true"]{border-color:var(--ok);background:var(--ok-soft)}
.check[aria-pressed="true"] .box{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.big{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.big input{font-family:var(--display);font-size:2.4rem;font-weight:700;width:150px;text-align:center;padding:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 13px;font-size:.92rem;font-weight:600}
.chips button[aria-pressed="true"]{background:var(--soft);border-color:var(--accent)}
.tip{font-size:.88rem;color:var(--muted);background:var(--bg);border-radius:12px;padding:10px 12px;margin:0}
.ok-pill{display:inline-flex;align-items:center;gap:6px;background:var(--ok-soft);color:var(--ok);border-radius:999px;padding:5px 12px;font-weight:700;font-size:.88rem}
.estado{font-size:.85rem;color:var(--muted);text-align:center;min-height:1.2em}


/* tarjeta del día a todo color (estilo tarjeta de entreno) */
#dia.hero{border:0;color:#fff;--ink:#FFFFFF;--muted:rgba(255,255,255,.84);--line:rgba(255,255,255,.3);--bg:rgba(0,0,0,.2);--surface:rgba(255,255,255,.18);--surface2:rgba(255,255,255,.18);
  --soft:rgba(255,255,255,.24);--accent:#FFFFFF;--cta:#FFFFFF;--cta-ink:#0B0D10;--ok:#FFFFFF;--ok-soft:rgba(255,255,255,.22);--on-ok:#0B0D10;--shadow:none}
#dia.h-fuerza{background:linear-gradient(145deg,#FF3B6B 0%,#FF6A3D 60%,#FF9A2E 100%)}
#dia.h-caminar{background:linear-gradient(145deg,#1E9E4A 0%,#159A7E 55%,#0E8FA6 100%)}
#dia.h-libre{background:linear-gradient(145deg,#0A6FD1 0%,#0B93C9 55%,#0FB2C4 100%)}
#dia.h-descanso{background:linear-gradient(145deg,#3A4150 0%,#2A2F39 100%)}
#dia.hero .eyebrow{color:rgba(255,255,255,.9)}
#dia.hero .link{color:#fff;text-decoration:underline;text-underline-offset:3px}
#dia.hero input{background:rgba(0,0,0,.2);border-color:rgba(255,255,255,.35);color:#fff}
#dia.hero input::placeholder{color:rgba(255,255,255,.65)}
#dia.hero .seg{background:rgba(0,0,0,.2)}
#dia.hero .seg button[aria-pressed="true"]{background:#fff;color:#0B0D10;box-shadow:none}
#dia.hero .chips button[aria-pressed="true"]{background:#fff;color:#0B0D10;border-color:#fff}
#dia.hero .ok-pill{background:#fff;color:#0B0D10}
#dia.hero .done-banner{background:rgba(255,255,255,.95);color:#0B0D10}
#dia.hero .cta{box-shadow:0 6px 18px rgba(0,0,0,.18)}

/* figuras de ejercicios */
.fig-box{background:var(--bg);border-radius:12px;padding:8px;display:flex;justify-content:center}
.fig{width:100%;max-width:360px;height:auto}
.fig .ff{stroke:var(--line);stroke-width:1.5}.fig .fp{fill:var(--line)}.fig .fd{fill:var(--muted)}
.fig .fl{stroke:var(--ink);stroke-width:5;stroke-linecap:round}.fig .ft{stroke:var(--ink);stroke-width:7;stroke-linecap:round}.fig .fh{fill:var(--ink)}
.fig .far .fl{stroke:var(--muted);opacity:.75}

/* rejillas de datos (hojas) */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.rf{display:flex;flex-direction:column;gap:4px;font-size:.86rem;font-weight:600;color:var(--muted);min-width:0}
.rf-in{display:flex;align-items:center;gap:6px}
.rf-in input{font-family:var(--display);font-size:1.35rem;font-weight:700;padding:6px 8px;min-width:0}
.rf-in .u{font-size:.82rem;font-weight:500;flex:none}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;text-align:left}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.opt small{display:block;color:var(--muted);font-size:.85rem}

/* Progreso */
.streak{display:flex;align-items:center;gap:14px}
.flame{width:60px;height:60px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(160deg,var(--flame2),var(--flame));color:#fff;flex:none}
.flame svg{width:34px;height:34px}
.sn{font-family:var(--display);font-size:3.2rem;font-weight:900;line-height:.9}
.sl{color:var(--muted);font-weight:600}
.sb{margin-left:auto;text-align:right;color:var(--muted);font-size:.85rem;font-weight:600}
.sb .tab{display:block;font-family:var(--display);font-size:1.6rem;color:var(--ink);font-weight:700;line-height:1}
.smsg{margin:0;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .ch{font-size:.7rem;font-weight:700;color:var(--muted);text-align:center}
.cal .c{aspect-ratio:1;max-width:100%;border-radius:9px;display:grid;place-items:center;font-size:.78rem;font-weight:700;background:var(--bg);color:var(--muted);border:1.5px solid transparent}
.cal .c.done{background:var(--ok);color:var(--on-ok)}
.cal .c.part{background:var(--part-soft);color:var(--part)}
.cal .c.rest{border:1.5px dashed var(--line);background:transparent}
.cal .c.fut{opacity:.35}
.cal .c.today{border-color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.st{background:var(--bg);border-radius:12px;padding:9px 8px;min-width:0}
.st .v{font-family:var(--display);font-size:1.45rem;font-weight:700;line-height:1.1}
.st .k{font-size:.72rem;color:var(--muted);font-weight:600}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;height:120px}
.b{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0}
.b .m{font-size:.7rem;font-weight:700;color:var(--muted);min-height:1em}
.b i{width:100%;max-width:26px;border-radius:7px 7px 3px 3px;background:var(--line);min-height:4px}
.b i.done{background:var(--ok)}.b i.part{background:var(--part)}
.b .dl{font-size:.75rem;font-weight:700;color:var(--muted)}
.b.today .dl{color:var(--accent)}
.goal{display:flex;flex-direction:column;gap:6px}
.goal-h{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:.92rem}
.goal-h span:last-child{color:var(--muted);font-weight:500}
.gbar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.gbar i{display:block;height:100%;background:linear-gradient(90deg,var(--r3),var(--ok));border-radius:5px}
.big-n{font-family:var(--display);font-size:2.4rem;font-weight:700;line-height:1}
.evo{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.evo-t{border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.evo-t .rf{font-size:.82rem}
.evo-v{font-size:1.7rem;line-height:1.1}
.evo-v small{font-family:var(--body);font-size:.85rem;font-weight:500;color:var(--muted)}
.evo-d{font-size:.8rem;color:var(--muted)}
.evo-d.good{color:var(--ok);font-weight:700}
.spark{width:100%;height:34px;margin-top:4px}
.recs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rec{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.rec .k{font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.rec .v{font-family:var(--display);font-size:1.6rem;font-weight:700;line-height:1.1}
.rec .w{font-size:.8rem;color:var(--muted)}

/* Historial */
.hw-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.hist{display:flex;flex-direction:column}
.h-row{display:flex;align-items:center;gap:12px;padding:10px 2px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;width:100%}
.h-row:first-child{border-top:0}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.ic svg{width:21px;height:21px}
.t-fuerza{color:var(--c-fuerza);background:color-mix(in srgb,var(--c-fuerza) 15%,transparent)}
.t-caminar{color:var(--c-caminar);background:color-mix(in srgb,var(--c-caminar) 15%,transparent)}
.t-libre{color:var(--c-libre);background:color-mix(in srgb,var(--c-libre) 15%,transparent)}
.t-descanso{color:var(--muted);background:var(--surface2)}
.h-main{flex:1;min-width:0;display:flex;flex-direction:column}
.h-t{font-weight:600}
.h-s{color:var(--muted);font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:.78rem;font-weight:700;border-radius:999px;padding:3px 10px;flex:none}
.b-done{background:var(--ok-soft);color:var(--ok)}
.b-part{background:var(--part-soft);color:var(--part)}
.b-none,.b-rest{background:var(--bg);color:var(--muted)}

/* barra de pestañas */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 86%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 11px;color:var(--muted);font-size:.78rem;font-weight:700;position:relative}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-current="page"]{color:var(--ink)}
.tabbar button[aria-current="page"] svg{color:var(--accent)}
.tabbar button[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:34%;right:34%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}

/* hoja inferior */
#sheet-bg{position:fixed;inset:0;background:var(--scrim);z-index:40}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:45;max-height:88vh;overflow-y:auto;background:var(--surface);border-radius:24px 24px 0 0;
  padding-top:8px;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  box-shadow:0 -8px 30px rgba(0,0,0,.18);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sh-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sh-grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sh-head h2{font-family:var(--display);font-size:1.6rem;text-transform:none;letter-spacing:.01em;color:var(--ink)}

/* modo guiado */
#guia{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;
  padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.g-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-height:100%}
.g-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.g-step{font-size:.85rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.g-name{font-family:var(--display);font-size:2.6rem;line-height:1;margin:0;text-wrap:balance}
.g-target{font-size:1.15rem;font-weight:600;color:var(--accent);margin-top:4px}
.g-cues{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px}
.g-timer{font-family:var(--display);font-size:4.5rem;font-weight:700;text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.g-sub{text-align:center;color:var(--muted)}
.g-reps{display:flex;align-items:center;gap:10px}
.g-reps input{width:90px;font-family:var(--display);font-size:1.6rem;font-weight:700;text-align:center;padding:6px}
.g-act{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.g-act .cta{flex:2 1 160px}.g-act .ghost{flex:1 1 90px}
.dots{display:flex;gap:3px}.dots i{flex:1;height:5px;border-radius:3px;background:var(--line)}.dots i.on{background:var(--ok)}
#guia .fig{max-width:420px}

@media (max-width:380px){.quick{gap:6px}.qt .v{font-size:.82rem}.rings{width:112px;height:112px}.stats{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){.bar i,.rp{transition:none}#sheet{animation:none}}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;color:var(--muted)}
.iconbtn svg{width:20px;height:20px}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;margin-right:6px;vertical-align:1px}
.sync-dot.on{background:var(--ok)}.sync-dot.err{background:var(--part)}
.file-btn{display:block;text-align:center;cursor:pointer}
.note .ghost{margin-top:8px}
</style>
</head>
<body>

<div class="wrap">
  <header class="appbar" id="appbar">
    <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--logo-a)"/><stop offset="1" stop-color="var(--logo-b)"/></linearGradient></defs><rect width="40" height="40" rx="11" fill="url(#lg)"/><path d="M8 29h5l4-7 5 4 9-13" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="31" cy="13" r="3.6" fill="#fff"/></svg>
    <div class="brand">Mi entreno</div>
    <button type="button" class="racha zero" id="racha" data-tab="progreso" aria-label="Ver tu racha"></button>
    <button type="button" class="iconbtn" data-sheet="ajustes" aria-label="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>

  <main class="panel" id="p-hoy">
    <div class="hello">
      <div><div class="hi" id="hi"></div><h1 id="fecha">Hoy</h1></div>
      <button type="button" class="chip-btn" id="volver" hidden>Volver a hoy</button>
    </div>
    <div class="weekbar">
      <button type="button" class="nav" id="prev" aria-label="Semana anterior">‹</button>
      <div class="week" id="week"></div>
      <button type="button" class="nav" id="next" aria-label="Semana siguiente">›</button>
    </div>
    <div class="note" id="aviso" hidden></div>
    <section class="card rings-card" id="anillos" aria-label="Resumen del día"></section>
    <div class="quick" id="quick"></div>
    <section class="card" id="dia" aria-live="polite"></section>
    <div class="estado" id="estado"></div>
  </main>

  <main class="panel" id="p-progreso" hidden>
    <h1 class="ptitle">Progreso</h1>
    <section class="card" id="c-racha"></section>
    <section class="card" id="c-semana"></section>
    <section class="card" id="c-objetivo"></section>
    <section class="card"><h2>Báscula</h2><div id="peso-box"></div></section>
    <section class="card" id="c-records"></section>
  </main>

  <main class="panel" id="p-historial" hidden>
    <h1 class="ptitle">Historial</h1>
    <div class="panel" id="hist"></div>
  </main>
</div>

<nav class="tabbar" aria-label="Secciones"><div class="tabbar-in">
  <button type="button" data-tab="hoy" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v8a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H5.5A1.5 1.5 0 0 1 4 19z"/></svg>Hoy</button>
  <button type="button" data-tab="progreso"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19h16"/><path d="M5 15l4-4 3 3 6-7"/><path d="M15 7h3v3"/></svg>Progreso</button>
  <button type="button" data-tab="historial"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.6"/><path d="M4 4v4h4"/><path d="M12 8v4l3 2"/></svg>Historial</button>
</div></nav>

<div id="sheet-bg" hidden></div>
<section id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-t"><div class="sh-in">
  <div class="sh-grab"></div>
  <div class="sh-head"><h2 id="sheet-t"></h2><button type="button" class="ghost sm" data-sheet-close>Listo</button></div>
  <div id="sheet-c" class="panel"></div>
</div></section>

<section id="guia" hidden aria-label="Entreno guiado"><div class="g-in" id="g-in"></div></section>

<script>
/* ---------- plan y datos fijos ---------- */
const PLAN={0:'descanso',1:'fuerza',2:'caminar',3:'fuerza',4:'caminar',5:'fuerza',6:'libre'};
const TIPO_TXT={fuerza:'Fuerza',caminar:'Caminar',libre:'Libre',descanso:'Descanso'};
const TIPO_DESC={fuerza:'Sesión en casa: completa, sin material o exprés',caminar:'30–40 min a paso ligero',libre:'Senderismo, bici, paseo largo…',descanso:'Recuperar también es entrenar'};
const EXS=[
  {id:'flex',n:'Flexiones',t:'8–10 · sin llegar al fallo'},
  {id:'sent',n:'Sentadilla al banco',t:'10–12 · bajar despacio'},
  {id:'remo',n:'Remo con mancuerna',t:'10–12 por brazo'},
  {id:'puente',n:'Puente de glúteo',t:'12–15'},
  {id:'plancha',n:'Plancha',t:'20–30 s'},
  {id:'bird',n:'Bird-dog',t:'8 por lado'}
];
const EXP=[
  {id:'flex',n:'Flexiones',t:'8–10 · sin llegar al fallo'},
  {id:'silla',n:'Sentadilla a una silla',t:'10–12 · bajar despacio'},
  {id:'puente',n:'Puente de glúteo',t:'12–15'},
  {id:'superman',n:'Superman',t:'10 · aguanta 2 s arriba'},
  {id:'bicho',n:'Bicho muerto',t:'6 por lado · muy despacio'}
];
const EXC=[
  {id:'flex',n:'Flexiones',t:'8–10 · sin llegar al fallo'},
  {id:'silla',n:'Sentadilla a una silla',t:'12–15 · 3 s bajando'},
  {id:'superman',n:'Superman',t:'10 · aguanta 2 s arriba'},
  {id:'puente',n:'Puente de glúteo',t:'15 · aguanta 2 s arriba'},
  {id:'plancha',n:'Plancha',t:'20–30 s'},
  {id:'bird',n:'Bird-dog',t:'8 por lado'}
];
const VARS={normal:{lab:'Completa',sub:'con material',corto:'completa'},casa:{lab:'Completa',sub:'sin material',corto:'sin material'},expres:{lab:'Exprés',sub:'15 min',corto:'exprés'}};
const RUT={
  casa:{exs:EXC,v:3,rest:60,warm:5,min:25,
    wl:['1 min de marcha en el sitio','1 min de círculos de brazos, hacia delante y hacia atrás','1 min de círculos de cadera','1 min de sentadillas suaves a la silla','1 min más de marcha']},
  normal:{exs:EXS,v:3,rest:60,warm:5,min:25,
    wl:['1 min de marcha en el sitio','1 min de círculos de brazos, hacia delante y hacia atrás','1 min de círculos de cadera','1 min de sentadillas suaves al banco','1 min más de marcha']},
  expres:{exs:EXP,v:2,rest:45,warm:3,min:15,
    wl:['1 min de marcha en el sitio','1 min de círculos de brazos y de cadera','1 min de sentadillas suaves a la silla']}
};
const R=d=>RUT[(d&&d.var)||'normal']||RUT.normal;
const tot=d=>{const r=R(d);return r.exs.length*r.v};
const SENS=['Fácil','Bien','Duro','Molestias'];
const ACT=['fuerza','caminar','libre'], AND=['caminar','libre'];
const RELOJ=[
  {k:'dur',l:'Duración',u:'min',m:'decimal',p:ACT},
  {k:'fcmed',l:'Pulso medio',u:'ppm',m:'numeric',p:ACT},
  {k:'fcmax',l:'Pulso máximo',u:'ppm',m:'numeric',p:ACT},
  {k:'kcal',l:'Calorías',u:'kcal',m:'numeric',p:ACT},
  {k:'dist',l:'Distancia',u:'km',m:'decimal',p:AND},
  {k:'ritmo',l:'Ritmo medio',u:'min/km',m:'text',p:AND,ph:'12:30'}
];
const BAS=[
  {k:'peso',l:'Peso',u:'kg',good:-1},
  {k:'imc',l:'IMC',u:'',good:-1},
  {k:'grasa',l:'Grasa corporal',u:'%',good:-1},
  {k:'grasakg',l:'Masa grasa',u:'kg',good:-1},
  {k:'visceral',l:'Grasa visceral',u:'',good:-1},
  {k:'musculo',l:'Masa muscular',u:'kg',good:1},
  {k:'esqueletico',l:'Músculo esquelético',u:'kg',good:1},
  {k:'agua',l:'Agua corporal',u:'%',good:0},
  {k:'cintura',l:'Cintura',u:'cm',good:-1}
];
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const DC=['D','L','M','X','J','V','S'];
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MC=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isFinite(n)?n:0};
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=parse(k);d.setDate(d.getDate()+n);return key(d)};
const monOf=k=>addDays(k,-((parse(k).getDay()+6)%7));
const TODAY=key(new Date());
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const fmtN=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const f1=v=>(Math.round(v*10)/10).toFixed(1).replace('.',',');
const fn=v=>f1(v).replace(/,0$/,'');
const fdate=k=>{const d=parse(k);return cap(DIAS[d.getDay()])+' '+d.getDate()+' de '+MES[d.getMonth()]};
const sdate=k=>{const d=parse(k);return DC[d.getDay()]+' '+d.getDate()+' '+MC[d.getMonth()]};
const ic=(p,fill)=>`<svg viewBox="0 0 24 24" fill="${fill?'currentColor':'none'}" stroke="${fill?'none':'currentColor'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const IC={
  fuerza:ic('<path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/>'),
  caminar:ic('<circle cx="13" cy="4.5" r="1.8"/><path d="M10.5 21l2-6-2.5-3 1-4.5 3.5 3.5h3M9.5 12.5l1-4.5-3 2-1 3M12.5 15l3.5 6"/>'),
  libre:ic('<path d="M3 19l6-10 4 6 2.5-3.5L21 19z"/>'),
  descanso:ic('<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>'),
  pasos:ic('<path d="M8.5 3c1.9 0 3 2 3 5s-1.1 5-3 5-3-2-3-5 1.1-5 3-5zM6.5 15.5h4v1.5a2 2 0 0 1-4 0zM15.5 7c1.9 0 3 2 3 5s-1.1 5-3 5-3-2-3-5 1.1-5 3-5zM13.5 19.5h4v.3a2 2 0 0 1-4 0z"/>'),
  bascula:ic('<rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><path d="M8 10a5.5 5.5 0 0 1 8 0M12 10.5l1.6-2.2"/>'),
  reloj:ic('<rect x="6.5" y="6" width="11" height="12" rx="3.2"/><path d="M9 6l.6-3h4.8l.6 3M9 18l.6 3h4.8l.6-3M12 9.5v3l2 1.2"/>'),
  notas:ic('<path d="M4 5h16v11H9.5L4 20z"/><path d="M8 9.5h8M8 12.5h5"/>'),
  play:ic('<path d="M8 5.5v13l10.5-6.5z"/>',true),
  check:ic('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
  flame:ic('<path d="M12 2c1 3.5-1.5 5-1.5 7.5 0 1.4 1 2.5 2.3 2.5 1.6 0 2.2-1.4 2-3 2.4 1.8 3.7 4.3 3.7 6.8A6.5 6.5 0 0 1 12 22a6.5 6.5 0 0 1-6.5-6.2C5.5 10.5 10.5 7 12 2z"/>',true)
};

/* ---------- estado ---------- */
const VERSION='1.3';
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
let days=LS.get('me.dias',{}), ajustes=Object.assign({pasosObj:8000},LS.get('me.ajustes',{})), sel=TODAY, cur=null;
let sync=LS.get('me.sync',{url:'',clave:''}), pend=new Set(LS.get('me.pend',[])), ajPend=LS.get('me.ajpend',false);
let syncing=false, syncTimer=null, lastSync=LS.get('me.last',0), syncOk=null;
let exOpen=false, figOpen='', sheetK='';

function blank(k){return{fecha:k,tipo:PLAN[parse(k).getDay()],calent:false,sets:{},reps:{},min:'',actividad:'',sens:'',peso:'',notas:'',reloj:{},bascula:{}}}
function getDay(k){const b=blank(k);if(!days[k])return b;const c=JSON.parse(JSON.stringify(days[k]));return Object.assign(b,c)}
function nSets(d){let n=0;R(d).exs.forEach(e=>(d.sets&&d.sets[e.id]||[]).forEach(v=>{if(v)n++}));return n}
function planObj(d){return d.tipo==='fuerza'?R(d).min:d.tipo==='caminar'?30:d.tipo==='libre'?20:0}
function status(d){
  if(!d)return'none';
  if(d.tipo==='descanso')return'done'; // descansar también cuenta como día cumplido
  if(d.tipo==='fuerza'){const n=nSets(d);return n===0?'none':n>=tot(d)?'done':'part'}
  const m=num(d.min), obj=planObj(d);
  return m>=obj?'done':m>0?'part':'none';
}
// Primer día apuntado: los descansos sin apuntar solo cuentan desde ahí y hasta hoy (se marcan según llegan).
const startKey=()=>{let m=TODAY;for(const k in days)if(k<m)m=k;return m};
const stOf=k=>days[k]?status(days[k]):(PLAN[parse(k).getDay()]==='descanso'&&k<=TODAY&&k>=startKey()?'done':'none');
function exMin(d){
  const m=num((d.reloj||{}).dur)||num(d.min); if(m)return m;
  return d.tipo==='fuerza'?Math.round(nSets(d)/tot(d)*R(d).min):0;
}
function planPct(d){
  if(d.tipo==='descanso')return 1;
  if(d.tipo==='fuerza')return nSets(d)/tot(d);
  return Math.min(1,num(d.min)/planObj(d));
}
function detail(d){
  if(!d)return'';
  const r=d.reloj||{}, x=[];
  if(d.tipo==='fuerza')x.push(nSets(d)+'/'+tot(d)+' series');
  else if(d.tipo!=='descanso')x.push(Math.round(exMin(d))+' min');
  if(d.tipo!=='descanso'){if(num(r.dist))x.push(fn(num(r.dist))+' km');if(r.fcmed)x.push(r.fcmed+' ppm')}
  if(num(r.pasos))x.push(fmtN(num(r.pasos))+' pasos');
  if(num(d.peso))x.push(fn(num(d.peso))+' kg');
  return x.join(' · ');
}
function title(d,tipo){
  if(d&&d.tipo==='libre'&&d.actividad)return d.actividad;
  if(d&&d.tipo==='fuerza')return 'Fuerza'+(d.var&&d.var!=='normal'&&VARS[d.var]?' '+VARS[d.var].corto:'');

}
function curStreak(){
  let k=TODAY,n=0; if(stOf(k)!=='done')k=addDays(k,-1);
  for(let i=0;i<730;i++){const x=stOf(k);if(x==='done')n++;else if(x!=='rest')break;k=addDays(k,-1)}
  return n;
}
function bestStreak(){
  const ks=Object.keys(days).sort(); if(!ks.length)return curStreak();
  let n=0,b=0;
  for(let k=ks[0];k<=TODAY;k=addDays(k,1)){const x=stOf(k);if(x==='done'){n++;b=Math.max(b,n)}else if(x!=='rest'&&k!==TODAY)n=0}
  return Math.max(b,curStreak());
}

function figLoop(ts){
  const els=document.querySelectorAll('svg[data-fig]');
  if(!els.length){figRaf=null;return}
  const per=3200,u=(ts%per)/per;
  let t=u<.15?0:u<.45?(u-.15)/.3:u<.65?1:u<.95?1-(u-.65)/.3:0;
  t=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  els.forEach(el=>{const id=el.dataset.fig;el.innerHTML=figBody(figPose(id,t),FIGS[id].props)});
  figRaf=requestAnimationFrame(figLoop);
}

/* ---------- Progreso ---------- */
function renderProgress(){
  // racha
  const cs=curStreak(), bs=bestStreak(), tst=stOf(TODAY);
  const msg=tst==='done'?'¡Hoy ya cuenta! Mañana, a por '+(cs+1)+'.':tst==='rest'?'Hoy toca descanso: tu racha está a salvo.':cs?'Completa lo de hoy para llegar a '+(cs+1)+'.':'Completa lo de hoy para empezar tu racha.';
  const start=addDays(monOf(TODAY),-28); let cal=DC.slice(1).concat('D').map(x=>`<span class="ch">${x}</span>`).join('');
  for(let i=0;i<35;i++){const k=addDays(start,i),st=k>TODAY?'fut':stOf(k);cal+=`<button type="button" class="c ${st}${k===TODAY?' today':''}" data-go="${k}" aria-label="${fdate(k)}" style="border-width:${k===TODAY?2:1.5}px">${parse(k).getDate()}</button>`}
  $('#c-racha').innerHTML=`<div class="streak"><div class="flame">${IC.flame}</div><div><div class="sn tab">${cs}</div><div class="sl">${cs===1?'día seguido':'días seguidos'}</div></div><div class="sb"><span class="tab">${bs}</span>mejor racha</div></div>
  <p class="smsg">${msg}</p><div class="cal">${cal}</div>
  <div class="legend"><span><i style="background:var(--ok)"></i>Hecho</span><span><i style="background:var(--part-soft);box-shadow:inset 0 0 0 1px var(--part)"></i>A medias</span></div>`;
  // semana
  const mon=monOf(TODAY); let act=0,mins=0,km=0,ps=[],bars=[];
  for(let i=0;i<7;i++){
    const k=addDays(mon,i),x=days[k],st=k>TODAY?'fut':stOf(k);
    if(st==='done')act++;
    const m=x&&x.tipo!=='descanso'?exMin(x):0; mins+=m;
    if(x){km+=num((x.reloj||{}).dist);const p=num((x.reloj||{}).pasos);if(p)ps.push(p)}
    bars.push({k,m,st,o:planObj(x||blank(k))});
  }
  const mx=Math.max(40,...bars.map(b=>Math.max(b.m,b.o)));
  $('#c-semana').innerHTML=`<h2>Esta semana</h2>
  <div class="stats"><div class="st"><div class="v tab">${act}/7</div><div class="k">días cumplidos</div></div><div class="st"><div class="v tab">${Math.round(mins)}</div><div class="k">minutos</div></div><div class="st"><div class="v tab">${fn(km)}</div><div class="k">km</div></div><div class="st"><div class="v tab">${ps.length?fmtN(ps.reduce((a,b)=>a+b,0)/ps.length):'—'}</div><div class="k">pasos/día</div></div></div>
  <div class="bars">${bars.map(b=>`<button type="button" class="b${b.k===TODAY?' today':''}" data-go="${b.k}" style="border:0;background:transparent;padding:0" aria-label="${fdate(b.k)}: ${Math.round(b.m)} minutos"><span class="m tab">${b.m?Math.round(b.m):''}</span><i class="${b.st}" style="height:${Math.max(4,b.m/mx*82)}px"></i><span class="dl">${DC[parse(b.k).getDay()]}</span></button>`).join('')}</div>`;
  // objetivo
  const wk=Object.keys(days).sort().filter(k=>num(days[k].peso)>0);
  if(!wk.length){$('#c-objetivo').innerHTML='<h2>Objetivo de peso</h2><p class="tip">Cuando te peses, aquí verás cuánto te falta para tu primer objetivo.</p>'}
  else{
    const s0=num(days[wk[0]].peso), sl=num(days[wk[wk.length-1]].peso), lost=s0-sl, g5=s0*.95, g10=s0*.9;
    const p5=Math.max(0,Math.min(1,lost/(s0-g5))), p10=Math.max(0,Math.min(1,lost/(s0-g10)));
    const row=(lab,g,p)=>`<div class="goal"><div class="goal-h"><span>${lab} · ${f1(g)} kg</span><span>${p>=1?'¡Conseguido!':'faltan '+f1(Math.max(0,sl-g))+' kg'}</span></div><div class="gbar"><i style="width:${p*100}%"></i></div></div>`;
    $('#c-objetivo').innerHTML=`<h2>Objetivo de peso</h2>
    <div><span class="big-n tab">${lost>0?'−':lost<0?'+':''}${f1(Math.abs(lost))} kg</span> <span class="rel">desde el ${sdate(wk[0]).slice(2)} (${f1(s0)} → ${f1(sl)} kg)</span></div>
    ${row('Primer objetivo (−5 %)',g5,p5)}${row('Segundo objetivo (−10 %)',g10,p10)}
    <p class="tip">Perder un 5 % del peso ya suele reducir la grasa del hígado. Un ritmo sano es de 0,5 a 1 kg por semana.</p>`;
  }
  renderEvo();
  // récords
  const best={};
  const upd=(n,v,k)=>{if(v>0&&(!best[n]||v>best[n].v))best[n]={v,k}};
  for(const k in days){const x=days[k],r=x.reloj||{};upd('dist',num(r.dist),k);upd('min',x.tipo!=='descanso'?exMin(x):0,k);upd('pasos',num(r.pasos),k);upd('flex',num((x.reps||{}).flex),k)}
  const rec=[['dist','Ruta más larga',v=>fn(v)+' km'],['min','Más minutos',v=>Math.round(v)+' min'],['pasos','Más pasos',v=>fmtN(v)],['flex','Flexiones seguidas',v=>Math.round(v)]].filter(r=>best[r[0]]);
  $('#c-records').innerHTML=`<h2>Récords</h2>`+(rec.length?`<div class="recs">${rec.map(([n,l,f])=>`<button type="button" class="rec" data-go="${best[n].k}"><span class="k">${l}</span><span class="v tab">${f(best[n].v)}</span><span class="w">${sdate(best[n].k)}</span></button>`).join('')}</div>`:'<p class="tip">Tus mejores marcas aparecerán aquí.</p>');
}
function renderEvo(){
  const box=$('#peso-box');
  const val=(d,k)=>k==='peso'?d.peso:(d.bascula||{})[k];
  const ks=Object.keys(days).sort();
  const series=BAS.map(f=>({f,pts:ks.map(k=>({k,v:num(val(days[k],f.k))})).filter(p=>p.v>0)})).filter(s=>s.pts.length);
  if(!series.length){box.innerHTML='<p class="tip">Cuando te peses, apunta los datos en <b>Báscula</b> y aquí verás cómo evoluciona cada uno.</p>';return}
  let eh='<div class="evo">';
  series.forEach(({f,pts})=>{
    const last=pts[pts.length-1], first=pts[0], diff=last.v-first.v;
    const good=f.good!==0&&Math.abs(diff)>=0.05&&Math.sign(diff)===f.good;
    let s='';
    if(pts.length>1){
      const W=300,H=40,P=4, ys=pts.map(p=>p.v), mn=Math.min(...ys), mxv=Math.max(...ys), rg=(mxv-mn)||1;
      const line=pts.map((p,i)=>(P+(W-2*P)*i/(pts.length-1)).toFixed(1)+','+(P+(H-2*P)*(1-(p.v-mn)/rg)).toFixed(1)).join(' ');
      s=`<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${line}" fill="none" stroke="var(${good?'--ok':'--accent'})" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
    }
    const u=f.u?' '+f.u:'';
    const dd=pts.length>1?`<span class="evo-d tab${good?' good':''}">${diff<0?'−':'+'}${fn(Math.abs(diff))}${u} desde el ${sdate(first.k).slice(2)}</span>`:'<span class="evo-d">primera medida</span>';
    eh+=`<div class="evo-t"><span class="rf">${f.l}</span><span class="num tab evo-v">${fn(last.v)}<small>${u}</small></span>${dd}${s}</div>`;
  });
  box.innerHTML=eh+'</div>';
}

function setEstado(t){$('#estado').textContent=t}

function saveLocal(){
  const ok=LS.set('me.dias',days); LS.set('me.pend',[...pend]); LS.set('me.ajustes',ajustes); LS.set('me.ajpend',ajPend);
  if(!ok)setEstado('No queda espacio en el móvil para guardar. Descarga una copia en Ajustes.');

function queue(){
  cur.fecha=sel; cur.ts=Date.now();
  if(cur.tipo==='fuerza'){cur.series=nSets(cur);cur.detalle=(VARS[cur.var||'normal']||VARS.normal).lab+' '+(VARS[cur.var||'normal']||VARS.normal).sub}
  else{cur.series='';cur.detalle=cur.tipo==='libre'?(cur.actividad||''):''}
  days[sel]=JSON.parse(JSON.stringify(cur));
  pend.add(sel); saveLocal();
  setEstado(sync.url?'Guardado · sincronizando…':'Guardado en el móvil');
  clearTimeout(syncTimer); syncTimer=setTimeout(doSync,1500);
  renderTop(); renderProgress(); renderHist();
}
function flush(){clearTimeout(syncTimer); if(pend.size||ajPend)doSync()}
function saveAjustes(){ajPend=true; saveLocal(); clearTimeout(syncTimer); syncTimer=setTimeout(doSync,1500)}
async function api(body){
  const r=await fetch(sync.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),cache:'no-store',redirect:'follow'});
  if(!r.ok)throw new Error('red');
  let j; try{j=await r.json()}catch(e){throw new Error('respuesta')}
  if(!j||!j.ok)throw new Error((j&&j.error)||'error');
  return j;
}
function merge(j){
  const rd=j.dias||{}; let changed=false;
  for(const k in rd){
    const r=rd[k], l=days[k];
    if(!r||typeof r!=='object')continue;
    if(!l||(!pend.has(k)&&(Number(r.ts)||0)>(Number(l.ts)||0))){days[k]=r;changed=true}
  }
  if(j.ajustes&&!ajPend&&Number(j.ajustes.pasosObj)>0)ajustes.pasosObj=Number(j.ajustes.pasosObj);
  if(changed){
    const focused=['#dia','#sheet','#guia'].some(q=>$(q).contains(document.activeElement));
    if(!focused){cur=getDay(sel);renderDia();if(sheetK&&sheetK!=='ajustes')renderSheet()}
  }
  renderTop(); renderProgress(); renderHist();
}
async function doSync(){
  if(!sync.url||!sync.clave||syncing)return syncOk;
  if(!navigator.onLine){setEstado('Sin conexión. Se sincronizará cuando vuelva.');return false}
  syncing=true;
  const sent=[...pend], dias={};
  sent.forEach(k=>{if(days[k])dias[k]=days[k]});
  const sentAj=ajPend;
  try{
    const res=await api({clave:sync.clave,dias,ajustes:sentAj?{pasosObj:ajustes.pasosObj}:undefined});
    sent.forEach(k=>{if(!days[k]||!dias[k]||days[k].ts===dias[k].ts)pend.delete(k)});
    if(sentAj)ajPend=false;
    merge(res);
    lastSync=Date.now(); LS.set('me.last',lastSync); saveLocal();
    syncOk=true; setEstado('Sincronizado');
  }catch(e){
    syncOk=false;
    setEstado(e.message==='clave'?'La clave de sincronización no es correcta. Revísala en Ajustes.':'No se ha podido sincronizar. Lo reintentaré más tarde.');
  }
  syncing=false; renderSyncDot();
  if(syncOk&&(pend.size||ajPend)){clearTimeout(syncTimer);syncTimer=setTimeout(doSync,1500)}
  return syncOk;
}
function renderSyncDot(){
  const a=$('#aviso');
  if(!sync.url){a.hidden=false;a.innerHTML='Tus datos se guardan en este móvil. Conecta tu hoja de Google para tener copia de seguridad y que Claude pueda verlos.<br><button type="button" class="ghost sm" data-sheet="ajustes">Conectar ahora</button>'}
  else if(syncOk===false){a.hidden=false;a.textContent=$('#estado').textContent}
  else a.hidden=true;
}
async function conectar(){
  const url=$('#sync-url').value.trim(), clave=$('#sync-clave').value.trim(), out=$('#sync-res');
  if(!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec/.test(url)){out.textContent='El enlace tiene que empezar por https://script.google.com/macros/s/ y acabar en /exec.';return}
  if(!clave){out.textContent='Falta la clave.';return}
  sync={url,clave}; LS.set('me.sync',sync);
  Object.keys(days).forEach(k=>pend.add(k)); ajPend=true; saveLocal();
  out.textContent='Conectando…';
  const ok=await doSync();
  out.textContent=ok?'Conectado. Tienes '+Object.keys(days).length+' días guardados en la hoja.':$('#estado').textContent;
}
function desconectar(){sync={url:'',clave:''};LS.set('me.sync',sync);syncOk=null;renderSheet();renderSyncDot();setEstado('')}
function exportar(){
  const blob=new Blob([JSON.stringify({app:'mi-entreno',version:1,exportado:new Date().toISOString(),dias:days,ajustes},null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='mi-entreno-'+TODAY+'.json';
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}
function importar(file){
  const fr=new FileReader();
  fr.onload=()=>{
    let j; try{j=JSON.parse(fr.result)}catch(e){$('#sync-res').textContent='Ese archivo no es una copia válida.';return}
    const rd=(j&&j.dias)||{}; let n=0;
    for(const k in rd){if(!/^\d{4}-\d{2}-\d{2}$/.test(k))continue;const r=rd[k],l=days[k];if(!l||(Number(r.ts)||0)>(Number(l.ts)||0)){days[k]=r;pend.add(k);n++}}
    if(j.ajustes&&Number(j.ajustes.pasosObj)>0){ajustes.pasosObj=Number(j.ajustes.pasosObj);ajPend=true}
    saveLocal(); cur=getDay(sel); renderAll(); $('#sync-res').textContent='Copia importada: '+n+' días nuevos o más recientes.'; doSync();
  };
  fr.readAsText(file);
}

let steps=[],si=0,actx=null,wl=null,tm=null;
const fmt=s=>Math.floor(s/60)+':'+pad(s%60);
function buildSteps(){const r=R(cur);steps=[{t:'warm'}];for(let v=0;v<r.v;v++){r.exs.forEach((e,i)=>steps.push({t:'ex',e,i,v}));if(v<r.v-1)steps.push({t:'rest',v})}steps.push({t:'end'})}
function firstStep(){if(!cur.calent)return 0;const i=steps.findIndex(s=>s.t==='ex'&&!((cur.sets[s.e.id]||[])[s.v]));return i<0?steps.length-1:i}
function stopTimer(){clearInterval(tm);tm=null}
function beep(){
  try{if(actx){const t=actx.currentTime;[0,.3].forEach(d=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.3,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.2);o.start(t+d);o.stop(t+d+.22)})}}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
}
function startTimer(sec,onDone){
  stopTimer();const end=Date.now()+sec*1000;
  const tick=()=>{const left=Math.max(0,Math.ceil((end-Date.now())/1000));const el=$('#g-timer');if(el)el.textContent=fmt(left);if(left<=0){stopTimer();beep();onDone&&onDone()}};
  tick();tm=setInterval(tick,250);
}

    body+=`<ol class="g-cues">${COMO[e.id].map(c=>`<li>${c}</li>`).join('')}</ol>
      <label class="g-reps" for="g-reps"><input id="g-reps" data-reps="${e.id}" inputmode="numeric" placeholder="—" value="${esc(cur.reps[e.id])}"><span class="rel">${e.id==='plancha'?'segundos aguantados':'repeticiones hechas'} (opcional)</span></label>`;
    act=`<button type="button" class="ghost" data-g="back">Atrás</button><button type="button" class="ghost" data-g="next">Saltar</button><button type="button" class="cta" data-g="ok">Hecho</button>`;
  } else if(s.t==='rest'){
    lab='Descanso';
    body=`<h1 class="g-name">Descansa</h1><div class="g-timer" id="g-timer">${fmt(r.rest)}</div><p class="g-sub">Bebe un poco de agua. Después: vuelta ${s.v+2} de ${r.v}, empezando por ${r.exs[0].n.toLowerCase()}.</p>`;
    act=`<button type="button" class="ghost" data-g="back">Atrás</button><button type="button" class="cta" data-g="next">Saltar descanso</button>`;
  } else {
    lab='Fin';
    body=`<h1 class="g-name">Entreno terminado</h1><p class="g-sub"><span class="num" style="font-size:2rem">${done}/${T}</span> series</p>
      <p class="tip">Al volver, toca <b>Sensación</b> para apuntar cómo te has sentido y <b>Reloj</b> para los datos del entreno.</p>`;
    act=`<button type="button" class="cta" data-g="salir">Volver</button>`;
  }
  $('#g-in').innerHTML=`<div class="g-top"><span class="g-step">${lab}</span><button type="button" class="ghost sm" data-g="salir">Salir</button></div>${dots}${body}<div class="g-act">${act}</div>`;
  $('#guia').scrollTop=0;
  figStart();
  if(s.t==='rest')startTimer(r.rest,()=>{si++;renderGuia()});
}

/* ---------- navegación ---------- */
function showTab(t){
  ['hoy','progreso','historial'].forEach(x=>{$('#p-'+x).hidden=x!==t});
  document.querySelectorAll('.tabbar [data-tab]').forEach(b=>{if(b.dataset.tab===t)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  try{localStorage.setItem('tab',t)}catch(e){}
  window.scrollTo({top:0});
}
function go(k){flush();sel=k;cur=getDay(k);exOpen=false;figOpen='';renderAll()}

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const T=e.target;
  if(T.closest('[data-g]')){
    const a=T.closest('[data-g]').dataset.g, s=steps[si];
    if(a==='salir')closeGuia();
    else if(a==='tw')startTimer(R(cur).warm*60);
    else if(a==='tp')startTimer(30);
    else if(a==='warmok'){cur.calent=true;queue();si++;renderGuia()}
    else if(a==='ok'&&s.t==='ex'){const arr=(cur.sets[s.e.id]||[false,false,false]).slice();arr[s.v]=true;cur.sets[s.e.id]=arr;queue();si++;renderGuia()}
    else if(a==='back'){si=Math.max(0,si-1);renderGuia()}
    else if(a==='next'){si=Math.min(steps.length-1,si+1);renderGuia()}
    return;
  }
  if(T.closest('[data-guia]')){openGuia();return}
  if(T.closest('[data-conectar]')){conectar();return}
  if(T.closest('[data-desconectar]')){desconectar();return}
  if(T.closest('[data-exportar]')){exportar();return}
  if(T.closest('[data-sheet-close]')||T.id==='sheet-bg'){closeSheet();return}
  const sh=T.closest('[data-sheet]'); if(sh){openSheet(sh.dataset.sheet);return}
  const tb=T.closest('[data-tab]'); if(tb){closeSheet();showTab(tb.dataset.tab);return}
  const g=T.closest('[data-go]'); if(g){go(g.dataset.go);showTab('hoy');return}
  const stp=T.closest('[data-settipo]'); if(stp){cur.tipo=stp.dataset.settipo;queue();closeSheet();return}
  if(T.closest('[data-exopen]')){exOpen=!exOpen;renderDia();return}
  const ft=T.closest('[data-figt]'); if(ft){figOpen=figOpen===ft.dataset.figt?'':ft.dataset.figt;renderDia();return}
  const vr=T.closest('[data-var]'); if(vr){cur.var=vr.dataset.var;queue();renderDia();return}
  const s=T.closest('[data-set]'); if(s){
    const id=s.dataset.set,i=+s.dataset.i; const a=(cur.sets[id]||[false,false,false]).slice(); a[i]=!a[i]; cur.sets[id]=a;
    queue(); renderDia(); return}
  const c=T.closest('[data-calent]'); if(c){cur.calent=!cur.calent;queue();renderDia();return}
  const q=T.closest('[data-quick]'); if(q){cur.min=+q.dataset.quick;queue();renderDia();return}
  const se=T.closest('[data-sens]'); if(se){cur.sens=cur.sens===se.dataset.sens?'':se.dataset.sens;
    document.querySelectorAll('[data-sens]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.sens===cur.sens));queue();return}
});
$('#prev').onclick=()=>go(addDays(sel,-7));
$('#next').onclick=()=>go(addDays(sel,7));
$('#volver').onclick=()=>go(TODAY);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
document.addEventListener('change',e=>{if(e.target.id==='importar'&&e.target.files[0])importar(e.target.files[0])});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.reps){cur.reps[el.dataset.reps]=el.value.trim();queue()}
  else if(el.dataset.rel){cur.reloj=Object.assign({},cur.reloj||{});cur.reloj[el.dataset.rel]=el.value.trim();queue()}
  else if(el.dataset.bas){const k=el.dataset.bas,v=el.value.trim();if(k==='peso')cur.peso=v;else{cur.bascula=Object.assign({},cur.bascula||{});cur.bascula[k]=v}queue()}
  else if(el.id==='min'){const v=el.value.replace(/\D/g,'');cur.min=v===''?'':+v;
    document.querySelectorAll('[data-quick]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.quick===cur.min));queue()}
  else if(el.id==='actividad'){cur.actividad=el.value;queue()}
  else if(el.id==='notas'){cur.notas=el.value;queue()}
  else if(el.id==='obj-pasos'){const v=parseInt(el.value.replace(/\D/g,''),10);if(v>0){ajustes.pasosObj=v;renderRings();saveAjustes()}}
});
window.addEventListener('scroll',()=>{$('#appbar').classList.toggle('scrolled',window.scrollY>4)},{passive:true});
window.addEventListener('pagehide',()=>flush());

/* ---------- arranque ---------- */
try{const t=localStorage.getItem('tab');if(t&&['hoy','progreso','historial'].includes(t))showTab(t)}catch(e){}
cur=getDay(sel); renderAll(); renderSyncDot();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if(sync.url)doSync();
window.addEventListener('online',()=>doSync());
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){if(key(new Date())!==TODAY){location.reload();return}doSync()}
  else flush();
});
(()=>{const p=new URLSearchParams(location.search),a=p.get('accion');if(!a)return;
  try{history.replaceState(null,'',location.pathname)}catch(e){}
  showTab('hoy');
  if(a==='pasos'||a==='bascula'||a==='notas')openSheet(a);
  else if(a==='entreno'&&cur.tipo==='fuerza'&&nSets(cur)<tot(cur))openGuia();
})();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
</body>
</html>
