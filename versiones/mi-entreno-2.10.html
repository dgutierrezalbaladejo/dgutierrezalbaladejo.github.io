<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi entreno</title>
<meta name="description" content="Tu plan diario de entreno en casa: fuerza, caminar, báscula, racha y logros.">
<meta name="theme-color" content="#F4F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101215" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi entreno">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
/* Mi entreno 2.0
   Layout: una columna para usar con el pulgar. Arriba solo información (saludo, semana, anillos, tarjeta del día);
   abajo, al alcance del pulgar, la acción principal del día y la barra de pestañas con un botón central "+".
   Paleta: grafito suave (no negro puro) en oscuro y gris muy claro en claro; el color de acción es el degradado
   coral→ámbar del logo, el verde solo marca lo hecho, y tres colores de anillo: coral (pasos), verde (ejercicio), cielo (plan). */
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --surface2:#EEF0F3; --ink:#14171C; --muted:#5D6572; --line:#E2E5EA;
  --accent:#C9461F; --cta:#EE5043; --cta-ink:#FFFFFF; --soft:#FDEBE4;
  --cta-bg:linear-gradient(135deg,#E8365F 0%,#F2603F 55%,#FF9A3D 100%);
  --ok:#1E9E4A; --ok-soft:#E2F4E7; --on-ok:#FFFFFF; --part:#B87400; --part-soft:#FDF0D8; --bad:#C8413B;
  --r1:#E5486A; --r2:#1E9E4A; --r3:#1B7FD1; --flame:#E07A00; --flame2:#F5A524; --gold:#C99200;
  --c-fuerza:#D9475F; --c-caminar:#1E9E4A; --c-libre:#1B7FD1; --c-gym:#7445D1;
  --logo-a:#FF3B6B; --logo-b:#FF8A2B; --scrim:rgba(10,12,16,.5);
  --shadow:0 1px 2px rgba(20,23,28,.05),0 4px 16px rgba(20,23,28,.05);
  --rs:10px; --rm:16px; --rl:22px; --pill:999px;
  --display:"Nunito","Nunito Sans",system-ui,sans-serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --tabh:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101215; --surface:#181B20; --surface2:#21252C; --ink:#ECEFF3; --muted:#98A1AE; --line:#2A2F37;
  --accent:#FF9A5C; --cta:#F2584A; --cta-ink:#FFFFFF; --soft:rgba(255,138,76,.14);
  --cta-bg:linear-gradient(135deg,#E8365F 0%,#F2603F 55%,#FF9A3D 100%);
  --ok:#3DD16F; --ok-soft:rgba(61,209,111,.14); --on-ok:#06140A; --part:#F2BE55; --part-soft:rgba(242,190,85,.14); --bad:#F07A73;
  --r1:#FF7A8E; --r2:#3DD16F; --r3:#6BB8FF; --flame:#FF9F2E; --flame2:#FFC857; --gold:#F2C94C;
  --c-fuerza:#FF7A8E; --c-caminar:#3DD16F; --c-libre:#6BB8FF; --c-gym:#B794FF;
  --scrim:rgba(0,0,0,.62); --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101215; --surface:#181B20; --surface2:#21252C; --ink:#ECEFF3; --muted:#98A1AE; --line:#2A2F37;
  --accent:#FF9A5C; --cta:#F2584A; --cta-ink:#FFFFFF; --soft:rgba(255,138,76,.14);
  --cta-bg:linear-gradient(135deg,#E8365F 0%,#F2603F 55%,#FF9A3D 100%);
  --ok:#3DD16F; --ok-soft:rgba(61,209,111,.14); --on-ok:#06140A; --part:#F2BE55; --part-soft:rgba(242,190,85,.14); --bad:#F07A73;
  --r1:#FF7A8E; --r2:#3DD16F; --r3:#6BB8FF; --flame:#FF9F2E; --flame2:#FFC857; --gold:#F2C94C;
  --c-fuerza:#FF7A8E; --c-caminar:#3DD16F; --c-libre:#6BB8FF; --c-gym:#B794FF;
  --scrim:rgba(0,0,0,.62); --shadow:none; color-scheme:dark}

/* base */
html{-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(var(--tabh) + 92px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
[hidden]{display:none!important}
html,body{overscroll-behavior-y:none}
button,input,textarea,label{-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}
.tab{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column}
h1,h2,.num{font-family:var(--display);font-weight:900;letter-spacing:-.01em}
h2{font-family:var(--body);font-size:.78rem;margin:0;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:800}
.rel{color:var(--muted);font-size:.9rem}
.q{font-weight:800;font-size:.92rem;margin-bottom:-6px}
.perf-dias{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700}
.perf-dias button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.3rem;font-weight:800;color:var(--ink)}
.perf-dias .num{font-size:1.7rem;min-width:1.2em;text-align:center}
.gl{display:flex;flex-direction:column;gap:6px;margin:2px 0 4px}
.gl>div{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:.95rem;border-bottom:1px solid rgba(255,255,255,.18);padding-bottom:6px}
.gl>div:last-child{border:0;padding:0}
.gl .tab{white-space:nowrap;opacity:.92}
.pr{display:inline-block;font-size:.75rem;font-weight:800;background:rgba(255,255,255,.24);border-radius:var(--pill);padding:1px 8px;margin-left:4px}
.gx-list{display:flex;flex-direction:column;gap:10px}
.gx{border:1px solid var(--line);border-radius:var(--rm);padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface2)}
.gx-h{display:flex;gap:8px;align-items:center}
.gx-n{font-weight:800}
.gx-last{font-size:.84rem;color:var(--muted);font-weight:700;margin-top:-2px}
.gx-last:empty{display:none}
.gx-sug{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.88rem;font-weight:700;background:color-mix(in srgb,var(--c-gym) 10%,transparent);border-radius:12px;padding:8px 10px;margin-top:-2px}
.gx-sug b{color:var(--c-gym)}
.gx-rep{display:flex;flex-direction:column;gap:8px}
.gx-rep button{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:var(--rm);padding:10px 12px;color:var(--ink);font:inherit}
.gx-rep button b{font-weight:800}.gx-rep button small{color:var(--muted);font-weight:600;font-size:.84rem}
.undo{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--ink);color:var(--bg);border-radius:var(--rm);padding:8px 8px 8px 14px;font-weight:700;font-size:.92rem}
.undo button{border:0;background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg);font-weight:800;border-radius:var(--pill);min-height:36px;padding:0 14px}
.aj-prof{display:flex;align-items:center;gap:14px;padding:14px;border-radius:var(--rm);background:var(--soft)}
.aj-prof .av{width:54px;height:54px;font-size:1.45rem}
.aj-prof b{display:block;font-family:var(--display);font-weight:900;font-size:1.25rem}
.aj-prof small{display:block;color:var(--muted);font-weight:700;font-size:.86rem}
.aj-g{display:flex;flex-direction:column;gap:6px}
.aj-gt{font-size:.76rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-left:4px}
.aj-list{background:var(--surface2);border-radius:var(--rm);overflow:hidden}
.aj-r{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;padding:12px 14px;border:0;background:none;text-align:left;color:var(--ink);font:inherit;text-decoration:none;border-top:1px solid var(--line)}
.aj-r:first-child{border-top:0}
.aj-r:active{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.aj-i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff}
.aj-i svg{width:19px;height:19px}
.aj-t{min-width:0}.aj-t b{display:block;font-weight:800}
.aj-t small{display:block;color:var(--muted);font-weight:600;font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aj-c{color:var(--muted);display:grid}.aj-c svg{width:18px;height:18px}
.aj-foot{text-align:center;color:var(--muted);font-size:.84rem;margin:0}
.sh-back{border:0;background:var(--surface2);color:var(--ink);width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;vertical-align:middle;margin-right:10px}
.sh-back svg{width:20px;height:20px}
.dias-sel{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dias-sel button{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:44px;font-weight:900;color:var(--muted);font-family:var(--display)}
.dias-sel button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.inv-r{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.inv-r:first-child{border-top:0;padding-top:0}
.inv-h{display:flex;align-items:center;gap:12px}.inv-h .nm{flex:1;font-weight:800}.inv-h .nm small{display:block;color:var(--muted);font-weight:700;font-size:.82rem}
.wcard{border-radius:22px;padding:22px 20px;color:#fff;background:linear-gradient(155deg,#E8365F 0%,#F2603F 55%,#FF9A3D 100%);display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 30px color-mix(in srgb,#F2603F 30%,transparent)}
.wcard .wm{font-weight:800;opacity:.9;font-size:.9rem;letter-spacing:.04em;text-transform:uppercase}
.wcard h3{margin:0;font-family:var(--display);font-weight:900;font-size:2rem;line-height:1.05;text-transform:capitalize}
.wcard .wg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wcard .wc{background:rgba(255,255,255,.16);border-radius:16px;padding:12px}
.wcard .wc .v{font-family:var(--display);font-weight:900;font-size:1.9rem;line-height:1}
.wcard .wc .k{font-weight:700;font-size:.85rem;opacity:.92;margin-top:4px}
.wcard .wl{font-weight:700;font-size:.95rem;line-height:1.4}
.cday{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-4px 0 2px}
.cday b{font-family:var(--display);font-weight:900;font-size:1.15rem;text-transform:capitalize}
.cday button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.3rem;font-weight:800}
.cday button:disabled{opacity:.3}
.chero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.cring{position:relative;width:148px;height:148px}
.cring svg{width:148px;height:148px;transform:rotate(-90deg)}
.cring circle{fill:none;stroke-width:13;stroke-linecap:round}
.cring .bg{stroke:var(--surface2)}
.cring .fg{stroke:var(--ok);transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.cring.over .fg{stroke:var(--flame)}
.cring .ct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.cring .ct b{font-family:var(--display);font-weight:900;font-size:1.75rem;line-height:1}
.cring .ct span{font-size:.78rem;color:var(--muted);font-weight:700;margin-top:3px;max-width:100px}
.mac{display:flex;flex-direction:column;gap:10px;min-width:0}
.mac-r{display:flex;flex-direction:column;gap:4px}
.mac-r .ml{display:flex;justify-content:space-between;font-size:.86rem;font-weight:800}
.mac-r .ml small{color:var(--muted);font-weight:700}
.mac-r .mb{height:7px;border-radius:99px;background:var(--surface2);overflow:hidden}
.mac-r .mb i{display:block;height:100%;border-radius:99px}
.cstat{display:flex;justify-content:space-around;text-align:center;border-top:1px solid var(--line);padding-top:12px}
.cstat b{display:block;font-family:var(--display);font-weight:900;font-size:1.15rem}
.cstat small{color:var(--muted);font-weight:700;font-size:.78rem}
.agua{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.agua button{border:0;background:none;padding:0;height:44px;display:grid;place-items:center;color:var(--line)}
.agua button svg{width:28px;height:36px}
.agua button[aria-pressed="true"]{color:var(--r3)}
.cm{display:flex;flex-direction:column;gap:8px}
.cm-h{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.cm-i{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:1.3rem;background:var(--surface2)}
.cm-h b{display:block;font-weight:800;font-size:1.02rem}
.cm-h small{color:var(--muted);font-weight:700;font-size:.84rem}
.cm-add{width:40px;height:40px;border-radius:50%;border:0;background:var(--cta-bg);color:var(--cta-ink);display:grid;place-items:center}
.cm-add svg{width:20px;height:20px}
.cm-it{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:6px 0 6px 52px;border-top:1px dashed var(--line);font-size:.92rem}
.cm-it small{display:block;color:var(--muted);font-weight:600;font-size:.8rem}
.cm-it .k{font-weight:800;white-space:nowrap}
.cm-it button{border:0;background:none;color:var(--muted);font-weight:800;width:30px;height:30px}
.cm-empty{padding-left:52px;color:var(--muted);font-size:.88rem;font-weight:600}
.cons{display:flex;flex-direction:column;gap:10px}
.con{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.con .ci{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:1.05rem}
.con p{margin:0;font-size:.93rem;line-height:1.4}
.ideas{display:grid;grid-template-columns:1fr;gap:10px}
.idea{border:1px solid var(--line);border-radius:var(--rm);padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.idea-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.idea-h b{font-weight:800}
.idea-h span{font-family:var(--display);font-weight:900;white-space:nowrap}
.idea small{color:var(--muted);font-weight:600;font-size:.84rem;line-height:1.35}
.idea .ghost{align-self:flex-start}
.cman details{border-top:1px solid var(--line);padding:10px 0}
.cman details:first-of-type{border-top:0}
.cman summary{font-weight:800;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.cman summary::after{content:'›';color:var(--muted);transform:rotate(90deg);transition:transform .2s}
.cman details[open] summary::after{transform:rotate(-90deg)}
.cintro{display:flex;flex-direction:column;gap:12px}
@media (max-width:370px){.chero{grid-template-columns:1fr;justify-items:center}.chero .mac{width:100%}.seg.four b{font-size:.78rem}.seg.four button{padding:9px 2px}}
.cintro .ci-t{font-family:var(--display);font-weight:900;font-size:1.35rem;margin:0;line-height:1.15}
.cintro ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.com-sum{display:flex;align-items:baseline;gap:6px}
.com-sum b{font-family:var(--display);font-weight:900;font-size:2rem;line-height:1}
.com-sum span{color:var(--muted);font-weight:700}
.com-bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.com-bar i{display:block;height:100%;border-radius:99px;background:var(--ok);transition:width .5s}
.com-bar.over i{background:var(--flame)}
.com-meals{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.com-meals button{border:0;background:var(--surface2);border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink);font:inherit}
.com-meals button b{font-weight:800;font-size:.8rem;color:var(--muted)}
.com-meals button span{font-family:var(--display);font-weight:900;font-size:1rem}
.com-meals button span.add{color:var(--accent);font-size:1.3rem;line-height:1}
.seg.four{grid-template-columns:repeat(4,1fr)}
#com-txt{width:100%;min-height:84px;resize:vertical;font:inherit;font-size:1rem;line-height:1.4;border:1px solid var(--line);border-radius:var(--rm);padding:10px 12px;background:var(--surface2);color:var(--ink);box-sizing:border-box}
.cl-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--rm);overflow:hidden}
.cl{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);background:var(--surface)}
.cl:first-child{border-top:0}
.cl-t{min-width:0}.cl-t b{display:block;font-weight:800}.cl-t small{display:block;color:var(--muted);font-weight:600;font-size:.84rem}
.cl-k{font-family:var(--display);font-weight:900;white-space:nowrap}
.cl-e{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:800}
.cl.unk{background:color-mix(in srgb,var(--flame) 9%,var(--surface))}
.cl.on{background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.cl-tot{display:flex;justify-content:space-between;padding:10px 12px;font-weight:800;background:var(--surface2)}
.com-ed{display:flex;flex-direction:column;gap:10px;border:1px solid var(--accent);border-radius:var(--rm);padding:12px}
.com-res{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow:auto}
.com-res button{display:flex;justify-content:space-between;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;color:var(--ink);font:inherit}
.com-res button small{color:var(--muted);font-weight:700;white-space:nowrap}
.com-ref{font-size:.78rem;color:var(--muted)}
.mi-l{display:flex;flex-direction:column;gap:2px}
.mi-r{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.92rem}
.mi-r button{border:0;background:none;color:var(--muted);font-weight:800;width:32px;height:32px}
.podio{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end;text-align:center}
.podio .pd{display:flex;flex-direction:column;align-items:center;gap:6px}
.podio .pd b{font-weight:800;font-size:.9rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.podio .pd small{color:var(--muted);font-weight:700;font-size:.82rem}
.podio .ps{width:100%;border-radius:12px 12px 4px 4px;background:var(--surface2);display:grid;place-items:center;font-size:1.4rem}
.reac{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.reac .anim-b{padding:4px 10px;min-height:32px}
.reac .anim-b .e{font-size:1rem;line-height:1}
.gx-last b{color:var(--c-gym)}
.gx-set{display:grid;grid-template-columns:22px 1fr auto 1fr auto 36px;align-items:center;gap:6px}
.gx-set input{text-align:center;font-family:var(--display);font-weight:900;font-size:1.15rem;padding:6px 4px;min-width:0}
.gx-set .u{font-size:.85rem;color:var(--muted);font-weight:700}
.gx-i{font-weight:800;color:var(--muted);text-align:center}
.gx-x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:800;flex:none}
.gx .ghost.sm{align-self:flex-start}
.gp{display:flex;flex-direction:column;gap:12px}
.gp-r{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.gp-n{font-weight:800}
.gp-v{font-family:var(--display);font-weight:900;font-size:1.2rem;text-align:right}
.gp-s{font-size:.82rem;color:var(--muted);font-weight:700}
.gp-r .spark{grid-column:1/-1}
.card{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--rl);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{display:flex;flex-direction:column;gap:14px}
.ptitle{font-family:var(--display);font-weight:900;font-size:2.1rem;margin:2px 0 0;line-height:1.05;letter-spacing:-.02em}
.row-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ic svg,.i24{width:24px;height:24px}

/* barra superior */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  display:flex;align-items:center;gap:10px;padding-block:12px 10px;margin-bottom:2px;border-bottom:1px solid transparent}
.appbar.scrolled{border-bottom-color:var(--line)}
.logo{width:32px;height:32px;flex:none}
.brand{font-family:var(--display);font-size:1.4rem;font-weight:900;letter-spacing:-.02em;line-height:1;flex:1;min-width:0}
.racha{display:flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--line);border-radius:var(--pill);padding:6px 12px 6px 9px;font-size:.92rem;font-weight:800;flex:none}
.racha svg{width:18px;height:18px;color:var(--flame)}
.racha.zero svg{color:var(--muted)}
.racha small{font-size:.72rem;font-weight:800;opacity:.7;margin-left:-2px}
.racha.bump{animation:bump .6s ease}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;color:var(--muted)}
.iconbtn svg{width:20px;height:20px}

/* Hoy: saludo y semana */
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;position:relative}
.hi{cursor:pointer;min-height:1.35em;-webkit-tap-highlight-color:transparent}
.hi b{color:var(--accent);font-weight:800}
.hi.swap{animation:hiIn .35s cubic-bezier(.2,.8,.2,1)}
@keyframes hiIn{from{opacity:0;transform:translateY(5px)}}
.hi{color:var(--muted);font-weight:700;font-size:.92rem}
.hello h1{margin:0;font-size:1.85rem;line-height:1.05;letter-spacing:-.02em;text-wrap:balance}
.chip-btn{border:1px solid var(--accent);background:var(--soft);color:var(--ink);border-radius:var(--pill);padding:8px 13px;font-size:.85rem;font-weight:700;flex:none}
.weekbar{display:flex;align-items:center;gap:2px}
.nav{width:36px;height:44px;border-radius:var(--rs);border:0;background:transparent;color:var(--muted);font-size:1.4rem;display:grid;place-items:center;flex:none}
.week{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:2px;min-width:0}
.wd{border:0;background:transparent;border-radius:var(--rm);padding:6px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:58px}
.wd .l{font-size:.7rem;color:var(--muted);font-weight:800}
.wd .d{font-family:var(--display);font-size:1.15rem;font-weight:800;line-height:1}
.wd.today .d{color:var(--accent)}
.wd.sel{background:var(--surface2)}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line);box-sizing:border-box}
.dot.done{background:var(--ok);border-color:var(--ok)}
.dot.part{background:var(--part);border-color:var(--part)}
.dot.frz{border-color:var(--r3);background:color-mix(in srgb,var(--r3) 35%,transparent)}
.dot.fut{opacity:.5}
.note{font-size:.92rem;background:var(--part-soft);color:var(--ink);border-radius:var(--rm);padding:12px 14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.note.info{background:var(--soft)}
.note .opts{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#sync-res input{margin-top:6px;font-size:.85rem}

/* anillos */
.rings-card{flex-direction:row;align-items:center;gap:16px}
.rings{width:124px;height:124px;flex:none}
.rt{fill:none;stroke-width:11;opacity:.18}
.rp{fill:none;stroke-width:11;stroke-linecap:round}
.rings.anim .rp{animation:ringIn .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes ringIn{from{stroke-dashoffset:var(--len)}}
.rleg{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
.ri{display:flex;align-items:flex-start;gap:9px;border:0;background:transparent;padding:0;text-align:left;min-width:0}
.rdot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:5px}
.rl{font-size:.7rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:block}
.rv{font-family:var(--display);font-size:1.4rem;font-weight:900;line-height:1.1;display:block}
.rv small{font-family:var(--body);font-size:.8rem;font-weight:600;color:var(--muted)}

/* accesos rápidos */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qt{border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);border-radius:var(--rm);padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;min-height:96px}
.qt svg{width:38px;height:38px;padding:8px;border-radius:12px;background:color-mix(in srgb,currentColor 14%,transparent);box-sizing:border-box}
.qt .t{font-size:.7rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.qt .v{font-size:.92rem;font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q-pasos svg{color:var(--r1)}.q-bascula svg{color:var(--flame)}.q-reloj svg{color:var(--r2)}.q-notas svg{color:var(--r3)}
.qt.hot{border-color:var(--flame);background:color-mix(in srgb,var(--flame) 9%,var(--surface))}

/* tarjeta del día */
#dia{border:0;color:#fff;--ink:#FFFFFF;--muted:rgba(255,255,255,.86);--line:rgba(255,255,255,.3);--bg:rgba(0,0,0,.18);--surface:rgba(255,255,255,.17);--surface2:rgba(255,255,255,.17);
  --soft:rgba(255,255,255,.24);--accent:#FFFFFF;--ok:#FFFFFF;--ok-soft:rgba(255,255,255,.22);--on-ok:#14171C;--shadow:none;position:relative;overflow:hidden}
#dia.h-fuerza{background:linear-gradient(150deg,#C93A58 0%,#D9584A 55%,#DE7440 100%)}
#dia.h-caminar{background:linear-gradient(150deg,#1B7A3E 0%,#228A47 55%,#2F9A50 100%)}
#dia.h-libre{background:linear-gradient(150deg,#1B5FBF 0%,#1570B4 55%,#0F7E9E 100%)}
#dia.h-gym{background:linear-gradient(150deg,#5A3BBE 0%,#6B43C6 55%,#8550C2 100%)}
#dia.h-descanso{background:linear-gradient(150deg,#3A4150 0%,#2B303A 100%)}
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.eyebrow{font-size:.75rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.92)}
.link{border:0;background:transparent;color:var(--accent);font-weight:700;font-size:.92rem;padding:8px 0;min-height:40px}
#dia .link{color:#fff;text-decoration:underline;text-underline-offset:3px}
.link.center{align-self:center}
.dt{font-family:var(--display);font-size:2.2rem;line-height:1;margin:0;letter-spacing:-.02em;font-weight:900;text-transform:none;color:#fff}
.dt span{color:var(--muted);font-weight:800;font-size:1.35rem}
.meta{color:var(--muted);font-size:.95rem;margin-top:-8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg);border-radius:var(--rm);padding:4px}
.seg button{border:0;background:transparent;border-radius:12px;padding:9px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.15;color:var(--muted);min-height:48px;justify-content:center}
.seg b{font-weight:800;font-size:.9rem}.seg small{font-size:.75rem;font-weight:700;opacity:.85}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
#dia .seg button[aria-pressed="true"]{background:#fff;color:#14171C}
.seg.two{grid-template-columns:1fr 1fr}
.prog{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .4s ease}
.prog .tab{font-weight:800;font-size:.95rem}
.big-min{display:flex;align-items:baseline;gap:8px}
.big-min .num{font-size:3rem;line-height:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:var(--pill);padding:5px 12px;font-weight:800;font-size:.85rem}
.pill svg{width:16px;height:16px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
#dia .pill.ok{background:#fff;color:#14171C}
.pill.up{background:color-mix(in srgb,var(--r2) 16%,transparent);color:var(--r2)}
#dia .pill.up{background:rgba(255,255,255,.22);color:#fff}
.tip{font-size:.88rem;color:var(--muted);background:var(--bg);border-radius:var(--rm);padding:10px 12px;margin:0}
#dia .tip{color:rgba(255,255,255,.92)}

/* lista de ejercicios */
.exlist{display:flex;flex-direction:column;gap:0}
.row{display:flex;align-items:center;gap:10px;padding-block:12px;border-top:1px solid var(--line)}
.ex-info{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:0}
.ex-n{font-weight:800;display:block}
.ex-t{color:var(--muted);font-size:.85rem;display:block}
.ex-ver{display:inline-block;font-size:.8rem;font-weight:700;margin-top:2px;text-decoration:underline;text-underline-offset:2px}
.ex-up{display:block;font-size:.8rem;font-weight:800;margin-top:2px}
.sets{display:flex;gap:6px;flex:none}
.sets button{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:transparent;font-family:var(--display);font-size:1.1rem;font-weight:900;color:var(--muted)}
.sets button[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.sets button.just{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.check{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:var(--rm);padding:12px;background:transparent;text-align:left;font-weight:700;min-height:48px}
.check .box{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--muted);display:grid;place-items:center;flex:none;font-size:.85rem}
.check[aria-pressed="true"]{border-color:var(--ok);background:var(--ok-soft)}
.check[aria-pressed="true"] .box{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}

/* entradas */
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;box-sizing:border-box;min-height:44px}
label.lab{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.92rem}
.big{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.big input{font-family:var(--display);font-size:2.4rem;font-weight:900;width:160px;text-align:center;padding:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:transparent;border-radius:var(--pill);padding:9px 15px;font-size:.92rem;font-weight:700;min-height:40px}
.chips button[aria-pressed="true"]{background:var(--soft);border-color:var(--accent)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.rf{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:700;color:var(--muted);min-width:0}
.rf-in{display:flex;align-items:center;gap:6px}
.rf-in input{font-family:var(--display);font-size:1.35rem;font-weight:900;padding:6px 8px;min-width:0}
.rf-in .u{font-size:.82rem;font-weight:600;flex:none}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.6rem;font-weight:800;flex:none}
.stepper input{width:96px;font-family:var(--display);font-size:2rem;font-weight:900;text-align:center;padding:4px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:var(--rm);padding:12px 14px;background:var(--surface);font-weight:700;min-height:52px;text-align:left;width:100%}
.toggle .sw{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.toggle[aria-pressed="true"] .sw{background:var(--ok)}
.toggle[aria-pressed="true"] .sw::after{transform:translateX(18px)}

/* botones */
.cta{border:0;background:var(--cta-bg);color:var(--cta-ink);border-radius:var(--pill);padding:0 20px;font-weight:800;font-size:1.08rem;display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;width:100%}
.cta svg{width:20px;height:20px}
.cta.done{background:var(--ok-soft);color:var(--ok)}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:var(--pill);padding:0 18px;font-weight:700;min-height:48px}
.ghost.sm{min-height:40px;padding:0 14px;font-size:.92rem}
.ghost:has(svg){display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ghost svg{width:18px;height:18px;flex:none}
.ghost.sm svg{width:16px;height:16px}
a.cta{box-sizing:border-box;text-decoration:none}
.file-btn{display:flex;align-items:center;justify-content:center;cursor:pointer}

/* acción principal (zona del pulgar) */
.actionbar{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));z-index:19;
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(to top,var(--bg) 62%,color-mix(in srgb,var(--bg) 0%,transparent))}
.actionbar .in{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center}
.actionbar .cta{box-shadow:0 6px 20px color-mix(in srgb,var(--cta) 30%,transparent)}
.actionbar .cta.done{box-shadow:none}
.restpill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 84px + env(safe-area-inset-bottom,0px));z-index:50;
  display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:var(--pill);padding:8px 8px 8px 16px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:rise .25s ease}
.restpill .num{font-size:1.5rem;min-width:64px}
.restpill button{border:0;border-radius:var(--pill);background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg);font-weight:800;min-height:40px;padding:0 12px}
@keyframes rise{from{transform:translate(-50%,16px);opacity:0}}

/* barra de pestañas */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabh);align-items:center}
.tabbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:.72rem;font-weight:800;height:100%;justify-content:center;position:relative}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-current="page"]{color:var(--ink)}
.tabbar button[aria-current="page"] svg{color:var(--accent)}
#btn-logros[aria-current="page"]{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.tabbar .bdot{position:absolute;top:9px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--surface)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-family:var(--display);color:#fff;flex:none;font-size:1rem}
.av.sm{width:32px;height:32px;font-size:.88rem}
.lg{display:flex;flex-direction:column;gap:12px}
.lg-r{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center}
.lg-r .nm{font-weight:800}
.lg-r .ssb{font-size:.84rem;color:var(--muted);font-weight:700}
.lg-r .rk{display:flex;align-items:center;gap:3px;font-weight:900;font-family:var(--display)}
.lg-r .rk svg{width:18px;height:18px;color:var(--flame)}
.lg-r .rk small{font-size:.72rem;font-weight:800;color:var(--muted)}
.lg-r .bar{grid-column:2/-1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.lg-r .bar i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.lg-r.yo .nm::after{content:' · tú';color:var(--muted);font-weight:700}
.fd{display:flex;flex-direction:column}
.fd-r{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.fd-r:first-child{border-top:0;padding-top:2px}
.fd-r .tx{font-size:.95rem;line-height:1.35}
.fd-r .tx b{font-weight:800}
.fd-r .ssb{font-size:.84rem;color:var(--muted);font-weight:700;margin-top:2px}
.fd-r .an{font-size:.82rem;color:var(--muted);font-weight:700;margin-top:4px}
.anim-b{display:flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:var(--pill);padding:6px 10px;font-weight:800;font-size:.85rem;min-height:36px}
.anim-b svg{width:16px;height:16px}
.anim-b[aria-pressed="true"]{color:var(--flame);border-color:color-mix(in srgb,var(--flame) 45%,transparent);background:color-mix(in srgb,var(--flame) 10%,transparent)}
.sol{display:flex;align-items:center;gap:12px}
.sol .nm{flex:1;font-weight:800}
.sol .nm small{display:block;color:var(--muted);font-weight:700;font-size:.82rem}
.sol .opts{display:flex;gap:8px}
.share-l{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.tabbar .plus{width:56px;height:56px;border-radius:50%;background:var(--cta-bg);color:var(--cta-ink);display:grid;place-items:center;margin:0 auto;box-shadow:0 6px 18px color-mix(in srgb,var(--cta) 35%,transparent)}
.tabbar .plus svg{width:28px;height:28px}

/* Progreso */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.st{background:var(--surface2);border-radius:var(--rm);padding:10px 8px;min-width:0}
.st .v{font-family:var(--display);font-size:1.45rem;font-weight:900;line-height:1.1}
.st .v small{font-family:var(--body);font-size:.75rem;font-weight:700;color:var(--muted)}
.st .k{font-size:.72rem;color:var(--muted);font-weight:700}
.chart-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:800;font-size:.9rem}
.chart-h span{color:var(--muted);font-weight:600;font-size:.8rem}
.bars{display:grid;gap:6px;height:128px;position:relative}
.bars .goal{position:absolute;left:0;right:0;border-top:1.5px dashed var(--muted);opacity:.5;pointer-events:none}
.b{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0;border:0;background:transparent;padding:0}
.b .m{font-size:.68rem;font-weight:800;color:var(--muted);min-height:1em}
.b i{width:100%;max-width:28px;border-radius:8px 8px 4px 4px;background:var(--line);min-height:4px;transform-origin:bottom}
.bars.anim .b i{animation:grow .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}}
.b i.done{background:var(--ok)}.b i.part{background:var(--part)}.b i.pas{background:var(--r1)}.b i.wk{background:var(--r3)}
.b .dl{font-size:.72rem;font-weight:800;color:var(--muted)}
.b.today .dl{color:var(--accent)}
.goal-b{display:flex;flex-direction:column;gap:6px}
.goal-h{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:.92rem}
.goal-h span:last-child{color:var(--muted);font-weight:600}
.gbar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.gbar i{display:block;height:100%;background:linear-gradient(90deg,var(--r3),var(--ok));border-radius:5px}
.big-n{font-family:var(--display);font-size:2.4rem;font-weight:900;line-height:1}
.evo{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.evo-t{border:1px solid var(--line);border-radius:var(--rm);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.evo-v{font-size:1.7rem;line-height:1.1}
.evo-v small{font-family:var(--body);font-size:.85rem;font-weight:600;color:var(--muted)}
.evo-d{font-size:.8rem;color:var(--muted)}
.evo-d.good{color:var(--ok);font-weight:800}
.spark{width:100%;height:34px;margin-top:4px}
.recs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rec{border:1px solid var(--line);background:var(--surface);border-radius:var(--rm);padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.rec .k{font-size:.72rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.rec .v{font-family:var(--display);font-size:1.6rem;font-weight:900;line-height:1.1}
.rec .w{font-size:.8rem;color:var(--muted)}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthnav b{font-family:var(--display);font-size:1.3rem;font-weight:900;text-transform:capitalize}

/* Logros: racha, retos y medallas */
.streak{display:flex;align-items:center;gap:14px}
.flame{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(160deg,var(--flame2),var(--flame));color:#fff;flex:none}
.flame svg{width:36px;height:36px}
.sn{font-family:var(--display);font-size:3.2rem;font-weight:900;line-height:.9}
.sl{color:var(--muted);font-weight:700}
.sb{margin-left:auto;text-align:right;color:var(--muted);font-size:.85rem;font-weight:700}
.sb .tab{display:block;font-family:var(--display);font-size:1.6rem;color:var(--ink);font-weight:900;line-height:1}
.smsg{margin:0;font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .ch{font-size:.68rem;font-weight:800;color:var(--muted);text-align:center}
.cal .c{aspect-ratio:1;max-width:100%;border-radius:10px;display:grid;place-items:center;font-size:.78rem;font-weight:800;background:var(--surface2);color:var(--muted);border:2px solid transparent;padding:0}
.cal .c.done{background:var(--ok);color:var(--on-ok)}
.cal .c.part{background:var(--part-soft);color:var(--part)}
.cal .c.frz{background:color-mix(in srgb,var(--r3) 18%,transparent);color:var(--r3)}
.cal .c.fut,.cal .c.out{opacity:.35}
.cal .c.blank{visibility:hidden}
.cal .c.today{border-color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.retos{display:flex;flex-direction:column;gap:12px}
.reto{display:flex;align-items:center;gap:12px}
.reto .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none}
.reto .ic svg{width:22px;height:22px}
.reto .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.reto .t{display:flex;justify-content:space-between;gap:8px;font-weight:800;font-size:.92rem}
.reto .t span{color:var(--muted);font-weight:700}
.reto.ok .t span{color:var(--ok)}
.medals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.medal{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:12px 6px;border-radius:var(--rm);background:var(--surface2);border:0;min-width:0}
.medal .m{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--muted);position:relative}
.medal .m svg{width:28px;height:28px}
.medal.on .m{background:linear-gradient(160deg,var(--mc2,var(--flame2)),var(--mc1,var(--flame)));color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--mc1,var(--flame)) 35%,transparent)}
.medal .n{font-size:.78rem;font-weight:800;line-height:1.2}
.medal .p{font-size:.7rem;color:var(--muted);font-weight:700}
.medal.new .m{animation:shine 1.2s ease 2}
@keyframes shine{50%{transform:scale(1.1) rotate(-6deg)}}

/* Historial */
.hist{display:flex;flex-direction:column}
.h-row{display:flex;align-items:center;gap:12px;padding:10px 2px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;width:100%;min-height:56px}
.h-row:first-child{border-top:0}
.tic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none}
.tic svg{width:21px;height:21px}
.t-fuerza{color:var(--c-fuerza);background:color-mix(in srgb,var(--c-fuerza) 15%,transparent)}
.t-caminar{color:var(--c-caminar);background:color-mix(in srgb,var(--c-caminar) 15%,transparent)}
.t-gym{color:var(--c-gym);background:color-mix(in srgb,var(--c-gym) 15%,transparent)}
.t-libre{color:var(--c-libre);background:color-mix(in srgb,var(--c-libre) 15%,transparent)}
.t-descanso{color:var(--muted);background:var(--surface2)}
.h-main{flex:1;min-width:0;display:flex;flex-direction:column}
.h-t{font-weight:800}
.h-s{color:var(--muted);font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:.75rem;font-weight:800;border-radius:var(--pill);padding:4px 10px;flex:none}
.b-done{background:var(--ok-soft);color:var(--ok)}
.b-part{background:var(--part-soft);color:var(--part)}
.b-none,.b-frz{background:var(--surface2);color:var(--muted)}
.b-frz{color:var(--r3)}

/* hoja inferior */
#sheet-bg{position:fixed;inset:0;background:var(--scrim);z-index:40;animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:45;max-height:90vh;overflow-y:auto;background:var(--surface);border-radius:26px 26px 0 0;
  padding-top:8px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  box-shadow:0 -8px 30px rgba(0,0,0,.18);animation:up .25s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(48px);opacity:.3}}
.sh-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sh-grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sh-head h2{font-family:var(--display);font-size:1.6rem;text-transform:none;letter-spacing:-.01em;color:var(--ink);font-weight:900}
.sh-foot{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom,0px));background:var(--surface);padding-block:10px 4px;margin-top:4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;border:1px solid var(--line);background:var(--surface2);border-radius:var(--rm);padding:14px;text-align:left;min-height:96px}
.tile svg{width:28px;height:28px}
.tile b{font-size:1rem}.tile small{color:var(--muted);font-weight:600;font-size:.82rem;margin-top:-6px}
.tile.main{grid-column:1/-1;background:var(--cta-bg);color:var(--cta-ink);border-color:transparent;flex-direction:row;align-items:center;gap:14px;min-height:68px}
.tile.main>span{display:flex;flex-direction:column;gap:2px;min-width:0}
.tile.main small{color:inherit;opacity:.88;margin:0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--rm);padding:12px;text-align:left;min-height:60px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.opt small{display:block;color:var(--muted);font-size:.85rem}

/* aviso flotante */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 66px);transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:12px;
  background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--rl);padding:12px 16px;box-shadow:0 10px 30px rgba(0,0,0,.2);width:min(92vw,420px);box-sizing:border-box;animation:drop .35s cubic-bezier(.2,.8,.2,1)}
.toast .m{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(160deg,var(--flame2),var(--flame));color:#fff;flex:none}
.toast .m svg{width:24px;height:24px}
.toast b{display:block}.toast span{color:var(--muted);font-size:.88rem}
@keyframes drop{from{transform:translate(-50%,-20px);opacity:0}}

/* figuras */
.fig-box{background:var(--bg);border-radius:var(--rm);padding:8px;display:flex;justify-content:center;margin-top:4px}
.fig{width:100%;max-width:360px;height:auto}
.fig .ff{stroke:var(--line);stroke-width:1.5}.fig .fp{fill:var(--line)}.fig .fd{fill:var(--muted)}
.fig .fl{stroke:var(--ink);stroke-width:5;stroke-linecap:round}.fig .ft{stroke:var(--ink);stroke-width:7;stroke-linecap:round}.fig .fh{fill:var(--ink)}
.fig .far .fl{stroke:var(--muted);opacity:.75}

/* modo guiado */
#guia{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;display:flex;flex-direction:column;
  padding-top:calc(12px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#guia[hidden]{display:none!important}
.g-in{max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px;flex:1}
.g-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.g-step{font-size:.82rem;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.07em}
.g-name{font-family:var(--display);font-size:2.4rem;line-height:1;margin:0;letter-spacing:-.02em;text-wrap:balance}
.g-target{font-size:1.1rem;font-weight:800;color:var(--accent);margin-top:6px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.g-cues{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:7px}
.g-timer{font-family:var(--display);font-size:5rem;font-weight:900;text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.g-ring{width:220px;height:220px;margin:0 auto;position:relative;display:grid;place-items:center}
.g-ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.g-ring circle{fill:none;stroke-width:10}
.g-sub{text-align:center;color:var(--muted)}
.g-next{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--rm);padding:10px 12px}
.g-next .fig{max-width:120px}
.g-act{position:sticky;bottom:0;margin-top:auto;display:flex;gap:10px;padding:12px 0 calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.g-act .cta{flex:1}
.g-act .ghost{flex:none;min-height:56px}
.dots{display:flex;gap:3px}.dots i{flex:1;height:5px;border-radius:3px;background:var(--line)}.dots i.on{background:var(--ok)}
.done-big{display:grid;place-items:center;gap:10px;text-align:center;padding-top:20px}
.done-big .m{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(160deg,var(--r2),var(--r3));color:#fff;animation:shine 1s ease}
.done-big .m svg{width:56px;height:56px}

.estado{font-size:.82rem;color:var(--muted);text-align:center;min-height:1.2em}
@media (max-width:380px){.quick{gap:6px}.qt .v{font-size:.82rem}.rings{width:108px;height:108px}.stats{grid-template-columns:1fr 1fr}.medals{grid-template-columns:repeat(2,1fr)}}
html.no-anim *,html.no-anim *::before,html.no-anim *::after{animation:none!important;transition:none!important}
.panel.enter{animation:enter .28s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}}
</style>

<script>

  {k:'dur',l:'Duración',u:'min',m:'decimal',p:ACT},

/* ---------- gimnasio: ejercicios con series, repeticiones y kilos ---------- */
const gN=s=>String(s||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const gOk=s=>!!s&&(num(s.r)>0||num(s.kg)>0);
const gymExs=d=>(d.gym||[]).filter(x=>String(x.n||'').trim()&&(x.s||[]).some(gOk));
function gymSets(d){let n=0;(d.gym||[]).forEach(x=>(x.s||[]).forEach(s=>{if(gOk(s))n++}));return n}
function gymMax(x){return Math.max(0,...(x.s||[]).filter(gOk).map(s=>num(s.kg)))}
function gymSum(x){
  const ss=(x.s||[]).filter(gOk); if(!ss.length)return '';
  const rs=ss.map(s=>num(s.r)), same=rs.every(r=>r===rs[0]), mk=gymMax(x), allK=ss.every(s=>num(s.kg)===mk);
  return (same&&rs[0]?ss.length+' × '+rs[0]:rs.map(r=>r||'—').join(', '))+(mk?' · '+(allK?'':'hasta ')+fn(mk)+' kg':'');
}
function gymPrev(name,before){
  const n=gN(name); if(!n)return null;
  const ks=Object.keys(days).filter(k=>k<before&&days[k].tipo==='gym').sort().reverse();
  for(const k of ks){const x=(days[k].gym||[]).find(e=>gN(e.n)===n&&(e.s||[]).some(gOk));if(x)return {k,x}}
  return null;
}
function gymBest(name,before){const n=gN(name);let b=0;for(const k in days){if(k>=before||days[k].tipo!=='gym')continue;(days[k].gym||[]).forEach(e=>{if(gN(e.n)===n)b=Math.max(b,gymMax(e))})}return b}
const gymPR=(x,k)=>{const m=gymMax(x),b=gymBest(x.n,k);return m>0&&b>0&&m>b};
const gymPRs=k=>{const d=days[k];return d&&d.tipo==='gym'?gymExs(d).filter(x=>gymPR(x,k)).length:0};
function gymDet(d){return gymExs(d).map(x=>x.n.trim()+' '+gymSum(x)).join(' · ')}

}

function gymSug(x){

  const ss=pv.x.s.filter(gOk), mk=gymMax(pv.x); if(!mk||!ss.length)return null;
  const top=ss.filter(s=>num(s.kg)===mk), minR=Math.min(...top.map(s=>num(s.r)||0));
  const step=mk<20?1:mk<60?2.5:5, sube=top.length>=2&&minR>=8;

}

}

function weekSes(m){let n=0;for(let i=0;i<7;i++){const k=addDays(m,i);if(k>TODAY)break;if(sesOf(k))n++}return n}

// Un día sin cumplir por semana (lunes a domingo) no rompe la racha: se gasta el comodín de esa semana.
function streakInfo(){

}

// Si las dos últimas veces completaste todas las series de un ejercicio y no te pareció duro, toca subir.
function lastSessions(id,before){

function sugerencia(e,dayKey){
  const ks=lastSessions(e.id,dayKey||sel); if(!ks.length)return null;
  const isT=e.id==='plancha', u=isT?' s':' reps', step=isT?5:2;
  const d0=days[ks[0]], last=num((d0.reps||{})[e.id]);

let prevStreak=LS.get('me.racha',null);
function racha(){
  const n=SI.cur, el=$('#racha');
  el.classList.toggle('zero',n<1);
  const wk=!!SI.weeks, rk=(wk?'w':'')+n;
  el.innerHTML=IC.flame+`<span class="tab">${n}</span>`+(wk?'<small>sem</small>':'');
  el.setAttribute('aria-label','Racha: '+n+(wk?(n===1?' semana seguida':' semanas seguidas'):(n===1?' día':' días')+' seguidos')+'. Ver logros');
  if(wk){
    if(prevStreak!==null&&typeof prevStreak==='string'&&prevStreak[0]==='w'&&n>+prevStreak.slice(1)){
      el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');
      if([2,4,8,12,26,52].includes(n))toast(IC.flame,'¡'+n+' semanas seguidas!','Cumpliendo tu objetivo semana tras semana.');
    }
    if(prevStreak!==rk){prevStreak=rk;LS.set('me.racha',rk)}
    return;
  }
  if(typeof prevStreak==='string')prevStreak=null;
  if(prevStreak!==null&&n>prevStreak){
    el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');
    if([3,7,14,21,30,50,75,100,150,200,365].includes(n))toast(IC.flame,'¡Racha de '+n+' días!','Sigue así: mañana a por '+(n+1)+'.');
  }
  if(prevStreak!==n){prevStreak=n;LS.set('me.racha',n)}
}

async function cuentaAccion(tipo){
  const out=$('#cu-res'), u=String(cuForm.u).trim().toLowerCase(), pw=String(cuForm.p);
  if(!servidor){out.textContent='Falta el enlace de invitación: ábrelo desde este móvil.';return}
  if(tipo==='registro'&&!nom()){out.textContent='Escribe tu nombre.';return}
  if(!/^[a-z0-9_-]{3,30}$/.test(u)){out.textContent=tipo==='login'?ERR_CU.login:ERR_CU.usuario;return}
  if(pw.length<6){out.textContent=tipo==='login'?ERR_CU.login:ERR_CU.pass;return}
  out.textContent=tipo==='registro'?'Creando tu cuenta…':'Entrando…';
  let j;
  try{j=await api(tipo==='registro'?{accion:'registro',invitacion:invit,usuario:u,pass:pw,nombre:nom()}:{accion:'login',usuario:u,pass:pw},servidor)}
  catch(e){out.textContent=ERR_CU[e.message]||'No se ha podido. Prueba otra vez.';return}
  if(!j.token){out.textContent=ERR_CU.accion;return}
  cuenta={url:servidor,usuario:j.usuario,token:j.token}; LS.set('me.cuenta',cuenta); cuForm={u:'',p:''}; soc=null; socOn=null; LS.set('me.social',null); LS.set('me.compartir',null);
  sync={url:'',clave:''}; LS.set('me.sync',sync);
  if(tipo==='login'){ajPend=false; if(j.nombre)ajustes.nombre=j.nombre} else ajPend=true;
  Object.keys(days).forEach(k=>pend.add(k)); saveLocal();
  closeSheet();
  toast(IC.check,tipo==='registro'?'¡Cuenta creada!':'¡Hola, '+(j.nombre||j.usuario)+'!',tipo==='registro'?'Todo lo que apuntes se guarda en tu cuenta.':'Estoy cargando tus datos.');
  await doSync(); if(!days[sel])cur=getDay(sel); renderAll();
}

async function compartir(url,txt){

async function invitar(){
  const out=$('#sync-res'); out.textContent='Creando el enlace…';
  let j; try{j=await api({accion:'invitacion',clave:sync.clave},sync.url)}catch(e){j=null}
  if(!j||!j.codigo){out.textContent='Para invitar, primero actualiza tu código de Google a la versión con cuentas.';return}
  compartir(enlaceInvitacion(sync.url,j.codigo),'Te invito a Mi entreno. Abre el enlace para crear tu cuenta:');
}

function renderInstall(){
  const el=$('#instalar'); if(!el)return;
  let off=false; try{off=!!LS.get('me.noinst',false)}catch(e){}
  const show=puedeInstalar()&&!off&&sel===TODAY; el.hidden=!show; if(!show)return;

}

  const qq=x.q==null?1:x.q;
  if(f.base==='u'){x.g=null;x.kcal=Math.round(f.kcU*qq);x.p=Math.round((f.pU||0)*qq);x.n=f.n;x.d=fq(qq)+' '+plur(f.ud||'ración',qq);x.f=f;return x}

  else if(x.u==='kg'||x.u==='l')g=qq*1000;
  else if(x.u==='cl')g=qq*10;
  else if(x.u&&x.u!=='unidad'&&x.u!=='racion')g=qq*((f.por&&f.por[x.u])||(f.ud&&nrm(f.ud)===x.u&&f.u)||GEN[x.u]||f.r);

  x.d=x.gOv!=null?g+' g':(x.u==='g'||x.u==='ml'||x.u==='kg'||x.u==='l'||x.u==='cl')?g+(x.u==='ml'||x.u==='l'||x.u==='cl'?' ml':' g')
    :x.u&&x.u!=='unidad'?fq(qq)+' '+plur(UNAME[x.u]||x.u,qq)+' · '+g+' g':x.q!=null&&f.ud?fq(qq)+' '+plur(f.ud,qq)+' · '+g+' g':x.q!=null?fq(qq)+' × '+f.r+' g':'ración · '+g+' g';

}

function dayMac(d){
  const m={k:0,p:0,h:0,g:0,fv:0,cat:{},n:0};
  if(d&&d.comidas)Object.values(d.comidas).forEach(l=>(l||[]).forEach(it=>{
    let h=it.h,gr=it.gr,fv=it.fv,cat=it.cat;
    if((h==null||gr==null)&&it.g){const f=comFood(it.k);if(f){h=it.g*(f.h||0)/100;gr=it.g*(f.gr||0)/100;fv=it.g*(f.fv||0)/100;cat=f.cat}}

}

function socResumen(){
  const mon=monOf(TODAY), w=weekStats(mon); let h=0,m=0;
  if(semanal()){h=weekSes(mon);m=pf().dias}
  else for(let i=0;i<7;i++){const k=addDays(mon,i);if(planTipo(k)!=='descanso')m++;if(k<=TODAY&&sesOf(k))h++}
  const ks=Object.keys(days).filter(k=>k<=TODAY&&sesOf(k)).sort(), u=ks[ks.length-1];
  return {racha:{n:SI.cur,u:SI.weeks?'semanas':'días'},semana:{h:Math.min(h,7),m:Math.min(m,7)},min:Math.round(w.mins),med:(seenMedals||[]).length,ult:u?{f:u,t:days[u].tipo}:null};
}
function socEventos(){
  const ev=[], k0=addDays(TODAY,-20), VN={normal:'Completa',casa:'Completa sin material',expres:'Exprés'};
  Object.keys(days).filter(k=>k>=k0&&k<=TODAY&&sesOf(k)).forEach(k=>{
    const d=days[k], m=Math.round(exMin(d)), mm=m?m+' min':''; let x='';
    if(d.tipo==='gym'){const n=gymExs(d).length;x=[n?n+(n===1?' ejercicio':' ejercicios'):'',mm].filter(Boolean).join(' · ')}
    else if(d.tipo==='fuerza')x=[VN[d.var||'normal']||'Completa',nSets(d)+' series',mm].filter(Boolean).join(' · ');
    else if(d.tipo==='libre')x=[String(d.actividad||'').trim().slice(0,40),mm].filter(Boolean).join(' · ');
    else x=mm;
    ev.push({id:'d'+k,f:k,t:d.tipo,x});
    if(d.tipo==='gym'){const pr=gymExs(d).filter(e=>gymPR(e,k)).map(e=>e.n.trim());if(pr.length)ev.push({id:'r'+k,f:k,t:'record',x:pr.slice(0,3).join(', ')})}
  });

  Object.keys(mf).forEach(id=>{const m=ML.find(z=>z.id===id);if(m&&mf[id]>=k0&&mf[id]<=TODAY)ev.push({id:'m'+id,f:mf[id],t:'medalla',x:m.n})});
  if(semanal()){const g=pf().dias;for(let m=monOf(k0);m<=TODAY;m=addDays(m,7)){let c=0,f='';for(let i=0;i<7;i++){const k=addDays(m,i);if(k>TODAY)break;if(sesOf(k)&&++c===g)f=k}if(f&&f>=k0)ev.push({id:'s'+m,f,t:'semana',x:g+(g===1?' día':' días')})}}

async function socSync(extra,force){

  if(socBusy&&!extra)return soc;
  socBusy=true;
  const body=Object.assign({accion:'social'},a,extra||{});
  if(!cuenta)body.nombre=nom()||'Yo';
  if(body.compartir===undefined&&socOn!==null)body.compartir=!!socOn;
  if(body.compartir!==false&&socOn&&body.accion==='social'){body.resumen=socResumen();body.eventos=socEventos()}
  let j=null;
  try{j=await api(body,socURL());socLast=Date.now();socErr='';
    if(j.necesitaUsuario)soc={necesitaUsuario:true};
    else if(j.yo){soc=j;if(socOn===null&&j.yo.compartir){socOn=true;LS.set('me.compartir',true)}}

}

/* ---------- temporizador de descanso (fuera del modo guiado) ---------- */
let restEnd=0,restTm=null;
function startRest(sec){
  initAudio(); restEnd=Date.now()+sec*1000; clearInterval(restTm);
  const p=$('#restpill'); p.hidden=false;
  const tick=()=>{const left=Math.max(0,Math.ceil((restEnd-Date.now())/1000));
    p.innerHTML=`<span class="rel" style="color:inherit;opacity:.8">Descanso</span><span class="num tab">${fmt(left)}</span><button type="button" data-rest="+15">+15 s</button><button type="button" data-rest="stop">Saltar</button>`;
    if(left<=0){clearInterval(restTm);restTm=null;beep(2);p.innerHTML=`<span class="num" style="min-width:0;font-size:1.1rem">¡A por la siguiente!</span><button type="button" data-rest="stop">OK</button>`;setTimeout(()=>{if(!restTm)p.hidden=true},4000)}};
  tick(); restTm=setInterval(tick,250);
}
function stopRest(){clearInterval(restTm);restTm=null;$('#restpill').hidden=true}

function bars(items,{cls,max,goal,lab}){
  const mx=Math.max(max||1,...items.map(i=>i.v),goal||0);
  const H=92;
  return `<div class="bars${animNext?' anim':''}" style="grid-template-columns:repeat(${items.length},1fr)">${goal?`<i class="goal" style="bottom:${(goal/mx*H+22).toFixed(0)}px"></i>`:''}${items.map(i=>`<button type="button" class="b${i.k===TODAY?' today':''}" ${i.go?`data-go="${i.go}"`:''} aria-label="${esc(i.aria||'')}"><span class="m tab">${i.v?esc(lab?lab(i.v):Math.round(i.v)):''}</span><i class="${i.cls||cls||''}" style="height:${Math.max(4,i.v/mx*H)}px"></i><span class="dl">${esc(i.d)}</span></button>`).join('')}</div>`;
}
const stBox=([v,s,k])=>`<div class="st"><div class="v tab">${v}${s?'<small>'+s+'</small>':''}</div><div class="k">${k}</div></div>`;
function weekStats(mon){
  let act=0,mins=0,km=0,ps=[],fz=0,ses=0,gy=0,gs=0,prs=0;
  for(let i=0;i<7;i++){const k=addDays(mon,i);if(k>TODAY)break;const x=days[k],st=stOf(k);
    if(st==='done')act++; if(x&&x.tipo==='fuerza'&&st==='done')fz++; if(sesOf(k))ses++;
    if(x&&x.tipo==='gym'){if(st==='done')gy++;gs+=gymSets(x);prs+=gymPRs(k)}
    if(x&&x.tipo!=='descanso')mins+=exMin(x);
    if(x){km+=num((x.reloj||{}).dist);const p=num((x.reloj||{}).pasos);if(p)ps.push(p)}}
  return {act,mins,km,pasos:ps.length?ps.reduce((a,b)=>a+b,0)/ps.length:0,fz,ses,gy,gs,prs};
}

      items.push({k,go:k,v:x&&x.tipo!=='descanso'?exMin(x):0,cls:st,d:DC[parse(k).getDay()],aria:fdate(k)});

// Tus pesos en el gimnasio: el mejor peso de cada ejercicio y cómo evoluciona
function renderGymProg(){
  const box=$('#c-gym'), ex=new Map();
  Object.keys(days).sort().forEach(k=>{const d=days[k];if(d.tipo!=='gym')return;gymExs(d).forEach(x=>{const n=gN(x.n);if(!ex.has(n))ex.set(n,{n:x.n.trim(),pts:[]});const m=gymMax(x);ex.get(n).pts.push({k,v:m,x})})});
  if(pf().modo==='casa'&&!ex.size){box.hidden=true;return}
  box.hidden=false;
  if(!ex.size){box.innerHTML='<h2>Tus pesos</h2><p class="tip">Cuando apuntes el gimnasio, aquí verás el mejor peso de cada ejercicio y cómo va subiendo.</p>';return}
  const L=[...ex.values()].sort((a,b)=>a.pts[a.pts.length-1].k<b.pts[b.pts.length-1].k?1:-1);
  box.innerHTML=`<div class="row-h"><h2>Tus pesos</h2><span class="rel">${L.length} ${L.length===1?'ejercicio':'ejercicios'}</span></div><div class="gp">${L.map(e=>{
    const ps=e.pts.filter(p=>p.v>0), last=e.pts[e.pts.length-1], best=ps.length?Math.max(...ps.map(p=>p.v)):0, first=ps[0];
    let s='';
    if(ps.length>1){const W=300,H=34,P=4,mn=Math.min(...ps.map(p=>p.v)),mx=Math.max(...ps.map(p=>p.v)),rg=(mx-mn)||1;
      s=`<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${ps.map((p,i)=>(P+(W-2*P)*i/(ps.length-1)).toFixed(1)+','+(P+(H-2*P)*(1-(p.v-mn)/rg)).toFixed(1)).join(' ')}" fill="none" stroke="var(--c-gym)" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`}
    const up=ps.length>1?ps[ps.length-1].v-first.v:0;
    return `<div class="gp-r"><span class="gp-n">${esc(e.n)}</span><span class="gp-v tab">${best?fn(best)+' kg':'—'}</span>
      <span class="gp-s">Última vez ${sdate(last.k).slice(2)}: ${esc(gymSum(last.x))}</span><span class="gp-s">${best?(up>0?'+'+fn(up)+' kg desde el principio':'mejor peso'):''}</span>${s}</div>`}).join('')}</div>`;
}
function renderEvo(){
  const box=$('#peso-box');
  const val=(d,k)=>k==='peso'?d.peso:(d.bascula||{})[k];
  const ks=Object.keys(days).sort();
  const series=BAS.map(f=>({f,pts:ks.map(k=>({k,v:num(val(days[k],f.k))})).filter(p=>p.v>0)})).filter(s=>s.pts.length);
  if(!series.length){box.innerHTML='<p class="tip">Cuando te peses, apunta los datos en <b>Báscula</b> y aquí verás cómo evoluciona cada uno.</p>';return}
  let eh='<div class="evo">';
  series.forEach(({f,pts})=>{
    const lastp=pts[pts.length-1], first=pts[0], diff=lastp.v-first.v;
    const good=f.good!==0&&Math.abs(diff)>=0.05&&Math.sign(diff)===f.good;
    let s='';
    if(pts.length>1){
      const W=300,H=40,P=4, ys=pts.map(p=>p.v), mn=Math.min(...ys), mxv=Math.max(...ys), rg=(mxv-mn)||1;
      const line=pts.map((p,i)=>(P+(W-2*P)*i/(pts.length-1)).toFixed(1)+','+(P+(H-2*P)*(1-(p.v-mn)/rg)).toFixed(1)).join(' ');
      s=`<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${line}" fill="none" stroke="var(${good?'--ok':'--r3'})" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
    }
    const u=f.u?' '+f.u:'';
    const dd=pts.length>1?`<span class="evo-d tab${good?' good':''}">${diff<0?'−':'+'}${fn(Math.abs(diff))}${u} desde el ${sdate(first.k).slice(2)}</span>`:'<span class="evo-d">primera medida</span>';
    eh+=`<div class="evo-t"><span class="rf">${f.l}</span><span class="num tab evo-v">${fn(lastp.v)}<small>${u}</small></span>${dd}${s}</div>`;
  });
  box.innerHTML=eh+'</div>';
}

function totals(){

  for(const k in days){const x=days[k],st=status(x);if(x.tipo==='fuerza'&&st==='done')fz++;km+=num((x.reloj||{}).dist);maxp=Math.max(maxp,num((x.reloj||{}).pasos));if(num(x.peso))pesos.push([k,num(x.peso)])}
  const s0=startKey();
  for(let m=monOf(s0);m<=TODAY;m=addDays(m,7)){const w=weekStats(m);minWeek=Math.max(minWeek,w.mins);
    let all=true;for(let i=0;i<7;i++){const k=addDays(m,i);if(k>TODAY||stOf(k)!=='done'){all=false;break}}if(all)perfect=true}
  pesos.sort((a,b)=>a[0]<b[0]?-1:1);
  const lost=pesos.length?pesos[0][1]-pesos[pesos.length-1][1]:0, goal5=pesos.length?pesos[0][1]*.05:5;
  let gym=0,prs=0; for(const k in days){if(days[k].tipo==='gym'&&status(days[k])==='done')gym++;prs+=gymPRs(k)}
  return {fz,km,maxp,minWeek,perfect,npes:pesos.length,lost,goal5,best:SI.best,gym,prs,doneAny:Object.keys(days).some(k=>status(days[k])==='done'&&days[k].tipo!=='descanso')};
}

// Las medallas que tienen sentido con tu plan (con el plan original salen las de siempre, en el mismo orden)
function medalsList(){
  const p=pf(), M=id=>MEDALS.find(m=>m.id===id), L=[];

function renderHist(){
  const ks=Object.keys(days).sort(), first=ks.length&&ks[0]<addDays(TODAY,-13)?ks[0]:addDays(TODAY,-13);
  const thisMon=monOf(TODAY); let h='',wk=null,rows='',cnt=0;
  const close=()=>{if(!wk)return;const lab=wk===thisMon?'Esta semana':wk===addDays(thisMon,-7)?'Semana pasada':(()=>{const a=parse(wk),b=parse(addDays(wk,6));return a.getDate()+' '+MC[a.getMonth()]+' – '+b.getDate()+' '+MC[b.getMonth()]})();
    h+=`<section class="card"><div class="row-h"><h2>${lab}</h2><span class="rel">${cnt} ${semanal()?(cnt===1?'día entrenado':'días entrenados'):(cnt===1?'día cumplido':'días cumplidos')}</span></div><div class="hist">${rows}</div></section>`};
  for(let k=TODAY;k>=first;k=addDays(k,-1)){
    const m=monOf(k); if(m!==wk){close();wk=m;rows='';cnt=0}
    const x=days[k], st=stView(k), tipo=x?x.tipo:planTipo(k);
    if(semanal()?sesOf(k):st==='done')cnt++;
    const lab={done:'Hecho',part:'A medias',frz:'Comodín',none:x?'Sin hacer':(k===TODAY?'Pendiente':'Sin apuntar')}[st];
    const det=x?detail(x):'';
    rows+=`<button type="button" class="h-row" data-go="${k}"><span class="tic t-${tipo}">${IC[tipo]}</span><span class="h-main"><span class="h-t">${esc(title(x,tipo))}</span><span class="h-s">${k===TODAY?'Hoy':sdate(k)}${det?' · '+esc(det):''}</span></span><span class="badge b-${st}">${lab}</span></button>`;
  }
  close();
  $('#hist').innerHTML=h;
}

async function doSync(){
  if(!(cuenta||(sync.url&&sync.clave))||syncing)return syncOk;
  if(!navigator.onLine){setEstado('Sin conexión. Se sincronizará cuando vuelva.');return false}
  syncing=true;
  const sent=[...pend], dias={};
  sent.forEach(k=>{if(days[k])dias[k]=days[k]});
  const sentAj=ajPend, ajP=()=>Object.assign({pasosObj:ajustes.pasosObj},ajustes.nombre!==undefined?{nombre:ajustes.nombre}:{},ajustes.perfil?{perfil:JSON.stringify(ajustes.perfil)}:{},ajustes.comida?{comida:JSON.stringify(ajustes.comida)}:{}), ajS=sentAj?JSON.stringify(ajP()):'';
  try{
    const res=await api(Object.assign(cuenta?{accion:'sync',token:cuenta.token}:{clave:sync.clave},{dias,ajustes:sentAj?JSON.parse(ajS):undefined}));
    sent.forEach(k=>{if(!days[k]||!dias[k]||days[k].ts===dias[k].ts)pend.delete(k)});
    if(sentAj&&JSON.stringify(ajP())===ajS)ajPend=false;
    merge(res);
    lastSync=Date.now(); LS.set('me.last',lastSync); saveLocal();
    syncOk=true; setEstado('Sincronizado');
  }catch(e){
    syncOk=false;
    setEstado(e.message==='sesion'?'Tu sesión se ha cerrado. Vuelve a iniciar sesión en Ajustes.':e.message==='clave'?'La clave de sincronización no es correcta. Revísala en Ajustes.':'No se ha podido sincronizar. Lo reintentaré más tarde.');
  }
  syncing=false; renderSyncDot();
  if(syncOk&&(pend.size||ajPend)){clearTimeout(syncTimer);syncTimer=setTimeout(doSync,1500)}
  return syncOk;
}

async function conectar(){

try{const t=localStorage.getItem('tab');if(t&&['hoy','progreso','logros','historial','comida'].includes(t))TAB=t}catch(e){}
cur=getDay(sel); renderTabs(); renderAll(true);
try{history.replaceState({k:'root'},'')}catch(e){}
{const t0=TAB;TAB='hoy';showTab('hoy',true);if(t0!=='hoy')showTab(t0)}
renderSyncDot(); checkMedals();
// Enlaces de invitación (?unirse=) y para entrar en otro móvil (?entrar=)
(()=>{const p=new URLSearchParams(location.search),u=p.get('unirse'),en=p.get('entrar');if(!u&&!en)return;
  viaEnlace=true;
  try{const [a,c]=(u||en).split('~'),url=ub64(a);if(okURL(url)){servidor=url;LS.set('me.servidor',url);if(u&&c){invit=c;LS.set('me.invitacion',c)}}}catch(e){}
  try{history.replaceState({k:'root'},'',location.pathname)}catch(e){}
  if(!cuenta&&servidor)setTimeout(()=>openSheet(u&&invit?'registro':'login'),300);
})();
if(!viaEnlace&&ajustes.nombre===undefined&&!Object.keys(days).length)setTimeout(()=>openSheet('hola'),400);
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if(sync.url||cuenta)doSync().then(()=>{if(socOn||TAB==='amigos')socSync(null,true)});
window.addEventListener('online',()=>doSync());
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){if(key(new Date())!==TODAY){location.reload();return}doSync().then(()=>{if(socOn||TAB==='amigos')socSync()});if(TAB==='hoy'){renderRings(true);splashPick()}}
  else flush();
});
(()=>{const p=new URLSearchParams(location.search),a=p.get('accion');if(!a)return;
  try{history.replaceState({k:'root'},'',location.pathname)}catch(e){}
  if(TAB!=='hoy')showTab('hoy');
  if(a==='pasos'||a==='bascula'||a==='notas')openSheet(a);
  else if(a==='entreno'&&cur.tipo==='fuerza'&&nSets(cur)<tot(cur))openGuia();
  else if(a==='entreno'&&cur.tipo==='gym')openSheet('gym');
})();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{})})}
</script>
